# XcodeGen project spec -- generates LearnWithAlphonso.xcodeproj
# deterministically (`xcodegen generate`), so the actual .xcodeproj is
# never hand-edited or committed (see .gitignore). This is what lets the
# app project exist without ever opening Xcode's GUI -- see
# docs/superpowers/specs/2026-09-17-native-ios-app-design.md.
#
# PRODUCT_BUNDLE_IDENTIFIER below is now frozen, not a placeholder -- an
# App ID (com.obsidianmedia.learnwithalphonso) is registered in App Store
# Connect and it's baked into RevenueCat, both entitlements files, APNs,
# and every provisioning profile. Found stale in a 2026-09-28 audit: this
# comment still described the pre-registration "cheap to change" state.
name: LearnWithAlphonso
options:
  bundleIdPrefix: com.obsidianmedia
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    # Automatic signing + no hardcoded team: the ios-app-build CI job
    # overrides CODE_SIGNING_ALLOWED=NO (debug/simulator, no team needed);
    # the release archive job passes DEVELOPMENT_TEAM on the command line
    # instead of committing it here (see .github/workflows/ios-release.yml).
    CODE_SIGN_STYLE: Automatic
packages:
  LearnWithAlphonsoKit:
    path: ../LearnWithAlphonsoKit
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    # Exact pin: the version that is built, device-tested and shipped. A bump is a
    # deliberate PR that also updates src/lib/ios-subscription-guards.test.ts, and CI
    # (scripts/check-revenuecat-resolution.sh) proves Xcode resolved exactly this.
    exactVersion: 5.92.0
targets:
  LearnWithAlphonso:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    # App Group shared with LearnWithAlphonsoWidget below -- the read-only
    # app -> widget progress channel (WidgetSharing.swift, Kit;
    # WidgetProgressPublisher.swift here). XcodeGen generates the
    # .entitlements file itself from `properties` below (never hand-
    # written/committed, same "generated, not source of truth" treatment
    # as the .xcodeproj). See WidgetSharing.appGroupID's doc comment for
    # the real Apple Developer portal registration this still needs before
    # a signed build can use it.
    entitlements:
      path: LearnWithAlphonso.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.obsidianmedia.learnwithalphonso
        # Required for Sign in with Apple (App Store Guideline 4.8). NOTE:
        # this generated file is currently NOT what either Debug or Release
        # actually builds against -- both configs override
        # CODE_SIGN_ENTITLEMENTS below to hand-written files (a pre-existing
        # gap, not introduced here; it's presumably also why the App Group
        # entitlement above hasn't been confirmed working on a signed
        # build). Listed here anyway so intent stays visible in the
        # generator spec, but the key that's actually effective today is
        # the one added directly to LearnWithAlphonso-Debug.entitlements
        # and LearnWithAlphonso-Release.entitlements.
        com.apple.developer.applesignin:
          - Default
        # Push Notifications (V4 candidate #2). Found live 2026-09-28: this
        # `properties` block is what XcodeGen uses to register a target's
        # capabilities into the generated .pbxproj's SystemCapabilities --
        # separate from, and consulted BEFORE, whatever CODE_SIGN_ENTITLEMENTS
        # override file says. Without an entry here, `xcodebuild archive`
        # doesn't know Push Notifications is a capability this target has,
        # so it silently drops aps-environment from the actual signed
        # binary even though both hand-written .entitlements files declare
        # it and the provisioning profile supports it -- confirmed by
        # inspecting the .xcarchive directly: the embedded provisioning
        # profile HAD aps-environment, the archived .app's own code
        # signature did NOT. Unlike a missing App Group or Sign-in-with-
        # Apple capability (which fail codesigning outright), a missing
        # Push Notifications capability registration fails silently --
        # that asymmetry is what made this take three earlier fix attempts
        # aimed at the wrong layer (codesign syntax, profile regeneration)
        # before landing here. The value below only matters for this
        # never-actually-signed-against generated file (see this block's
        # own comment above); Debug vs Release's real aps-environment
        # value still comes from each config's own CODE_SIGN_ENTITLEMENTS
        # override, unaffected by this key.
        aps-environment: production
    dependencies:
      - package: LearnWithAlphonsoKit
      - package: RevenueCat
      - target: LearnWithAlphonsoWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsidianmedia.learnwithalphonso
        # iPhone only, set HERE on the target on purpose: XcodeGen's
        # iOS-application preset sets TARGETED_DEVICE_FAMILY "1,2" at target
        # level, which silently beat the project-level "1" in `settings.base`
        # above -- every build through 48 shipped as iPhone+iPad
        # (UIDeviceFamily [1, 2], confirmed by unzipping build 48's .ipa),
        # so App Store Connect demanded iPad screenshots. ios-release.yml
        # now fails any .ipa whose UIDeviceFamily isn't [1].
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        # Merged with the synthesized Info.plist (Xcode 13+ supports both
        # at once) -- carries CFBundleURLTypes for Google sign-in's
        # ASWebAuthenticationSession callback, which has no INFOPLIST_KEY_
        # equivalent. See ../Info.plist.
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        # App Store Connect's upload validation (error 90474) requires all
        # four orientations declared even for a TARGETED_DEVICE_FAMILY=1
        # (iPhone-only) app, to support iPad multitasking metadata -- found
        # via a real failed `xcrun altool --upload-app` run, not a guess.
        # Multiple INFOPLIST_KEY_* values for an array-typed key are
        # space-separated (Xcode 13+ synthesized Info.plist convention).
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 48: iPhone itself is portrait-only (emitted as the
        # UISupportedInterfaceOrientations~iphone variant, which iOS prefers
        # over the base key on iPhone). Every screen is designed for
        # portrait; the four-orientation base key above stays only to keep
        # the upload validator happy. Pre-submission audit, 2026-09-29.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # Covers every course and every recording screen, and says what happens to the audio. Pinned by
        # src/lib/ios-binary-polish.test.ts and checked in the exported .ipa by ios-release.yml.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Learn with Alphonso uses your microphone so you can practise speaking in your lessons and conversations. Recordings are sent for transcription and aren't stored."
        # The home-screen name. Without it iOS shows the product name, truncated.
        INFOPLIST_KEY_CFBundleDisplayName: "Alphonso"
        MARKETING_VERSION: "1.0"
        # 35-38: the "Empty or missing audio"/short-recording saga, see
        # docs/BACKLOG.md §0.0-h for the full trail. 39-40: build 38 hung
        # on launch (FRONTBOARD watchdog SIGKILL, "scene-create", same
        # signature as build 29's) -- root cause was RootView's
        # @Environment(\.colorScheme) read forming a feedback loop with its
        # own .preferredColorScheme; fixed in 40 by reading
        # UIScreen.main.traitCollection directly instead. CONFIRMED fixed
        # on a real device -- LaunchBreadcrumbs.swift (and the Info.plist
        # keys it needed) removed again in 41. 41 also ships the real
        # recording-quality fix: real debugTiming data proved the mic
        # button's own press gesture was resetting itself almost instantly
        # (a view changing its own appearance -- the recording-state fill
        # color -- while a gesture was attached to that same view), not a
        # recording/network/session bug. See docs/BACKLOG.md §0.0-h/§0.0-k.
        # 42: ships SRSEngine.swift's lapse-interval fix (see
        # docs/BACKLOG.md §0.0-m item 3) -- a 2026-09-22 SM-2 scheduling
        # fix on the web app was never ported to iOS's local copy, so a
        # lapsed review on a well-established item got a harsher interval
        # than intended for about a week. No UI/behavior change otherwise.
        # 43: ships two more fixes from the 2026-09-29 fresh (cold-context)
        # whole-codebase audit: (1) ProgressSyncClient.fetchProgress now
        # calls the restore_hearts_if_due RPC when a read-back refill time
        # has already elapsed -- HeartsEconomy.resolveHeartsRefill existed
        # since 2026-09-18 but was never wired into any iOS path, so a user
        # who ran out of hearts and waited out the 30-minute window saw "0
        # Hearts" indefinitely until some other write RPC happened to run.
        # (2) All four recording screens now balance RecordingState's
        # counter in onDisappear -- a view torn down mid-hold (navigating
        # away while the mic button is physically pressed) never fired the
        # drag gesture's .onEnded, leaking the counter and permanently
        # suppressing the podcast player's post-interruption resume.
        # 44: real TestFlight feedback from build 43, fixed same-day: a
        # "Hold to talk" label on Practice/Hector (they had zero on-screen
        # indication this is a hold gesture, not a tap -- real debugTiming
        # data showed presses consistently under 0.3s, exactly what a tap
        # looks like); the Learn tab's lesson-completion dot now reflects
        # real completion instead of `index == 0`, and auto-scrolls to
        # where the learner left off; a share button for a team's join
        # code; a real member list + owner-only kick for teams (there was
        # none before); a "Next episode" button in the podcast mini-bar;
        # and a client-side timeout + clearer loading text on "Generate
        # more practice."
        # 45: more real TestFlight feedback from build 44. (1) A real
        # "Continue to next lesson" flow (LessonPlayerView now holds
        # `lesson` as @State and transforms itself in place, rather than
        # threading a bindable NavigationPath down from LessonBrowserView
        # just to push one stack entry per lesson). (2) A screenshotted
        # bug: a lesson's bottom-pinned primary button (Begin/Check/
        # Continue) could land exactly where the podcast mini-bar sits --
        # LessonPlayerView is pushed via NavigationStack, so the mini-bar
        # safeAreaInset reserved by the tab ROOT (LessonBrowserView)
        # doesn't extend to it; applied again directly to the pushed
        # destination, which fixes every phase (overview/vocab/quiz/
        # finish) at once. OverviewScreen additionally moved off a
        # Spacer()-pinned button onto a ScrollView, as defense in depth.
        # Before shipping, a second cold-context audit (explicitly told
        # to scrutinize the two patterns above) found and fixed 5 more
        # real issues folded into this same build: iOS never spent a
        # heart on a wrong answer, ever (recordAnswer() only queued
        # reinforcement, never called loseHeart -- grepped the whole app
        # target, zero call sites); getMyTeam()/getTeamMembers() parsed
        # real timestamptz fields with plain ISO8601DateFormatter(),
        # which fails on PostgREST's actual fractional-second precision
        # (the exact bug parsePostgresTimestamp already exists to fix,
        # just not visible across files since `private` is file-scoped
        # in Swift) -- likely made teams invisible to real users; a
        # stale doc comment; a reinforcement-question id collision risk
        # across lessons; and an attemptSeed reset the code never
        # actually performed despite its own comment claiming it did.
        #
        # 46: four independent third-party audits (ChatGPT 5.6 Astra,
        # Fable 5, Codex #3, Codex #4) after build 45, plus a fresh-
        # context pre-ship re-audit of this same work -- 12 real
        # findings total, all fixed. Highest severity first: (1)
        # accept_friend_invite took any uuid with zero consent check,
        # and uuids are already incidentally exposed via leaderboard/
        # team/duel rows -- any authenticated user could force a
        # friendship on anyone. Replaced with an opaque per-user invite
        # code in its own table with no client-facing read policy at
        # all, mirroring the existing team join_code pattern. (2) That
        # invite code was itself generated as base64, which includes '/'
        # and '+' -- spliced unencoded into a URL path segment, ~22% of
        # invite links would have silently 404'd. Switched to hex. (3)
        # The iOS hold-to-talk gesture (all four recording screens --
        # Practice, Conversation, Hector, Campaign) had two races: a
        # DragGesture's repeated onChanged during a hold could call
        # startRecording() more than once before the async mic-
        # permission callback resolved, and separately, all four screens
        # share ONE recorder instance across every press, so a rapid
        # double-press could let a stale delayed stop() finalize the
        # WRONG press's recording (garbled or silently dropped turns --
        # the exact symptom class this app fought for weeks). Both
        # closed with per-press synchronous guard flags and a
        # generation counter; a related teardown-during-permission-
        # request gap fixed alongside it. (4) A kicked team member could
        # rejoin instantly with the same unrotated join code --
        # kick_team_member only deleted the row that also held the only
        # switch-lock information. (5) /api/chat accepted an arbitrary
        # client-controlled systemPrompt with no server check, letting a
        # caller bypassing the app UI turn a quota-gated route into a
        # general-purpose LLM proxy funded by this app's own NVIDIA key
        # -- now whitelisted against the real scenario/campaign
        # personas. (6) Web lesson-completion translate grading had no
        # AI-quota gate at all, unlike every other AI-cost path in the
        # app. (7) The AI-processing disclosure sheet only ever covered
        # the four voice screens, never the written-translation grading
        # paths that also send learner text to NVIDIA. (8) An XP-mint
        # exploit and a UGC-filter false-positive-on-real-names
        # regression (both already fixed same-day as build 45, folded
        # in here since they hadn't shipped in an app build yet). (9)
        # None of five batched gamification writes ever checked their
        # own error result -- a failed upsert silently reported success;
        # now throws instead (does not yet fix the underlying lack of
        # write atomicity, a larger follow-up deliberately not attempted
        # under deadline pressure). No real device was available to test
        # the hold-to-talk fixes -- recommend a rapid-double-tap pass on
        # all four recording screens.
        #
        # 47: the account owner's own first real hands-on QA pass on
        # build 46, on a real device -- two real bugs found and fixed.
        # "Generate more practice" was failing live (confirmed via real
        # Vercel logs: a fast, non-erroring call still returned 0
        # questions, and a retry hit a genuine 20s timeout); the
        # max_tokens: 800 cap from build 45's own fix was likely
        # truncating real completions mid-JSON, raised to 2048. The
        # review due-count badge showed 0 while the Review screen itself
        # showed 11 due items -- the shared cache was only ever
        # populated by opening that screen once, now also refreshed
        # during app sync/foreground. Also confirmed real but explicitly
        # deferred to a feature build after submission (the account
        # owner's own call): iOS never gates lesson play on 0 hearts
        # anywhere, and "buy a heart/streak freeze with XP" has zero UI
        # on iOS -- both already have a working web/server counterpart,
        # neither was ever wired into an iOS screen. The hold-to-talk
        # race fixes from build 46 are still unverified on a real
        # device.
        #
        # 48: the 2026-09-29 pre-submission audit. (1) Access tokens now
        # refresh proactively (Session.refreshIfNeeded, on a timer and on
        # every foreground): ~47 call sites used a token that expired an
        # hour into a session, so account deletion, export, reporting and
        # sync all failed until relaunch -- deletion is what a reviewer
        # tests last. Delete/export also retry once after a 401. Being
        # offline or rate-limited no longer signs the learner out. (2)
        # Report/Block on team member rows and "Report Team Name" on the
        # public top-teams list -- the one social surface without them
        # (Guideline 1.2). (3) The AI consent sheet names Deepgram and
        # NVIDIA and offers "Not now" instead of a forced "Got it"
        # (Guideline 5.1.2(i)). (4) The paywall states the free trial and
        # the price after it, for StoreKit-eligible users only. (5) iPhone
        # is portrait-only.
        # 49: iPhone-only for real (TARGETED_DEVICE_FAMILY on the target --
        # see its comment above). Builds through 48 were universal by
        # accident, which made App Store Connect require 13-inch iPad
        # screenshots at Add for Review. No code change.
        # 50: first build after build 49; resubmission.
        CURRENT_PROJECT_VERSION: "50"
      configs:
        Release:
          # Manual signing, scoped to just this app target -- NOT set as a
          # global xcodebuild command-line override, because Xcode's
          # implicit signing targets for SPM package products (RevenueCat,
          # LearnWithAlphonsoKit) categorically reject provisioning
          # profiles ("does not support provisioning profiles"). A
          # command-line CODE_SIGN_STYLE=Manual/PROVISIONING_PROFILE_SPECIFIER
          # override applies to every target in the build including those,
          # breaking the archive -- found live 2026-09-21. Scoping it here
          # instead (only this target's build settings) leaves the
          # packages on Automatic, which they require.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # Placeholder -- ios-release.yml's "Generate Xcode project" step
          # substitutes the real UUID (from the IOS_PROVISIONING_PROFILE_UUID
          # secret) into this file with `sed` before running `xcodegen
          # generate`, so it's baked into the generated .xcodeproj as a
          # literal value. NOT resolved via xcodebuild's $(VAR) build-setting
          # indirection (the pattern this file uses for
          # $(REVENUECAT_API_KEY) below) -- found live 2026-09-21 that
          # code-signing-specific attributes like PROVISIONING_PROFILE_SPECIFIER
          # don't reliably resolve that way, unlike plain string settings.
          PROVISIONING_PROFILE_SPECIFIER: "PLACEHOLDER_PROVISIONING_PROFILE_UUID"
          # RCApiKey moved to ../Info.plist directly on 2026-09-23 --
          # neither this per-config INFOPLIST_KEY_RCApiKey setting NOR a
          # $(VAR)-indirected version of it ever actually reached the
          # built app's Info.plist, despite both resolving correctly in
          # xcodebuild's own effective build settings and the generated
          # .pbxproj (confirmed via `xcodebuild -showBuildSettings` and a
          # direct `.pbxproj` grep) -- Xcode's Info.plist-synthesis-merged-
          # with-a-real-INFOPLIST_FILE mode (this target uses both) only
          # merges Apple's own well-known keys via INFOPLIST_KEY_*, not
          # arbitrary custom ones like this. See ../Info.plist's own
          # comment on its RCApiKey entry for the full writeup and the
          # working fix (same pattern CFBundleURLTypes already used there
          # for the same class of limitation).
          # V4 candidate #2 (real push) -- wired in 2026-09-22 once the
          # Push Notifications capability was confirmed enabled on the
          # App ID and the Distribution provisioning profile was
          # regenerated to include it (reusing the existing certificate,
          # no new one minted -- see docs/BACKLOG.md sec 1.3). Safe to
          # wire now; was deliberately left out until this prerequisite
          # was real, not assumed (see
          # LearnWithAlphonso-Release.entitlements' own header comment).
          CODE_SIGN_ENTITLEMENTS: LearnWithAlphonso-Release.entitlements
        Debug:
          # V4 candidate #2 (real push) -- Debug/Simulator only. NOT set
          # for Release yet -- see LearnWithAlphonso-Release.entitlements'
          # own comment for why (would break the manual-signing archive
          # step before the Push Notifications capability actually exists
          # on the App ID).
          CODE_SIGN_ENTITLEMENTS: LearnWithAlphonso-Debug.entitlements

  # WidgetKit extension -- V4 candidate #6 (home-screen streak widget).
  # Reads a small progress snapshot LearnWithAlphonso (the app target)
  # publishes into their shared App Group's UserDefaults suite; never
  # writes back to it. See ios/LearnWithAlphonsoKit/Sources/
  # LearnWithAlphonsoKit/WidgetSharing.swift for the shared wire format
  # and identifiers, and WidgetProgressPublisher.swift (app target) for
  # the publish side.
  #
  # Manual Release signing added 2026-09-22, same pattern as the app
  # target below: com.obsidianmedia.learnwithalphonso.widget was
  # registered as its own App ID, granted the App Groups capability
  # (linked to group.com.obsidianmedia.learnwithalphonso via the portal
  # -- that link has no App Store Connect API equivalent, confirmed
  # live), and a distribution provisioning profile was generated for it
  # reusing the existing certificate (no new cert minted). See
  # docs/BACKLOG.md sec 1.4 for the full trail.
  # App Store / Devpost screenshot automation (screenshot-shot-list.md,
  # Hackaton/Shipaton/03-submission-materials/). Drives the real app --
  # signed in as the seeded demo account (scripts/seed-demo-account.ts) via
  # Session.uiTestBootstrapSession's #if DEBUG hook, never a mock -- and
  # captures each shot-list screen. Must build/run with the Debug config
  # (see the `schemes:` block below): that bootstrap hook does not exist
  # in Release.
  LearnWithAlphonsoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LearnWithAlphonsoUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsidianmedia.learnwithalphonso.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: LearnWithAlphonso

  LearnWithAlphonsoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # excludes PrivacyInfo.xcprivacy below -- it's re-added as its own
      # entry with an explicit buildPhase so it lands in "Copy Bundle
      # Resources" rather than being auto-classified by the folder scan
      # (this file's unfamiliar extension risks being picked up as
      # "Compile Sources" otherwise, which would fail the build).
      - path: LearnWithAlphonsoWidget
        excludes:
          - PrivacyInfo.xcprivacy
      - path: LearnWithAlphonsoWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: LearnWithAlphonsoWidget/LearnWithAlphonsoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.obsidianmedia.learnwithalphonso
    dependencies:
      - package: LearnWithAlphonsoKit
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obsidianmedia.learnwithalphonso.widget
        # Match the app (iPhone only) -- same preset override as the app
        # target's own comment explains.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        # Merged with the synthesized Info.plist -- carries NSExtension,
        # which has no INFOPLIST_KEY_ equivalent. See
        # LearnWithAlphonsoWidget/Info.plist.
        INFOPLIST_FILE: LearnWithAlphonsoWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Streak"
        # An embedded extension's version must match its containing app's
        # (App Store Connect validation) -- kept in sync with the app
        # target's MARKETING_VERSION/CURRENT_PROJECT_VERSION above by hand
        # for now (no XcodeGen mechanism to derive one from the other).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "50"
        SKIP_INSTALL: true
      configs:
        Release:
          # Same scoping rationale as the app target's Release config
          # below: manual signing set per-target, not as a global
          # xcodebuild override (which would also hit the SPM package
          # targets and break the archive).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # ios-release.yml's "Generate Xcode project" step substitutes
          # the real UUID (IOS_WIDGET_PROVISIONING_PROFILE_UUID secret)
          # with `sed`, same pattern as the app target's placeholder.
          PROVISIONING_PROFILE_SPECIFIER: "PLACEHOLDER_WIDGET_PROVISIONING_PROFILE_UUID"

# An explicit scheme, replacing XcodeGen's auto-generated one, so
# LearnWithAlphonsoUITests actually runs as part of `-scheme
# LearnWithAlphonso`'s test action -- an auto-generated per-target scheme
# would only ever build/run the app target alone. `build.targets` still
# includes the app target (`all`) so ios-app-build.yml's existing
# `xcodebuild build -scheme LearnWithAlphonso` keeps working unchanged.
# `test.config: Debug` is load-bearing: Session.uiTestBootstrapSession's
# #if DEBUG hook does not exist in a Release build, so the screenshot
# pipeline must run against Debug or the seeded demo account can never
# sign in non-interactively.
#
# `environmentVariables` here is the actual first-class Xcode mechanism
# (a Test action's own environment, same as Xcode's Scheme Editor UI) for
# getting a value into the xctest bundle's process -- used instead of, not
# just alongside, a `TEST_RUNNER_`-prefixed xcodebuild argument: that CLI
# convention did NOT reach the process (confirmed live -- the accessibility
# tree still showed the plain sign-in screen after adding it), so this
# replaces that guess with a documented feature rather than stacking a
# second guess on top of a wrong one. Each `$(VAR)` resolves against
# whatever plain `VAR=value` xcodebuild is invoked with -- the workflow
# still passes those, just no longer TEST_RUNNER_-prefixed.
schemes:
  LearnWithAlphonso:
    build:
      targets:
        LearnWithAlphonso: all
        LearnWithAlphonsoUITests: [test]
    test:
      config: Debug
      environmentVariables:
        - variable: UI_TEST_ACCESS_TOKEN
          value: "$(UI_TEST_ACCESS_TOKEN)"
          isEnabled: true
        - variable: UI_TEST_REFRESH_TOKEN
          value: "$(UI_TEST_REFRESH_TOKEN)"
          isEnabled: true
        - variable: UI_TEST_USER_ID
          value: "$(UI_TEST_USER_ID)"
          isEnabled: true
        - variable: UI_TEST_EXPIRES_AT
          value: "$(UI_TEST_EXPIRES_AT)"
          isEnabled: true
        - variable: SCREENSHOT_OUTPUT_DIR
          value: "$(SCREENSHOT_OUTPUT_DIR)"
          isEnabled: true
      targets:
        - LearnWithAlphonsoUITests
    run:
      config: Debug
