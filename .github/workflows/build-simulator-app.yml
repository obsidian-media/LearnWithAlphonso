name: Build Simulator App

# Builds LearnWithAlphonso.app for the iOS SIMULATOR and keeps it as a
# downloadable artifact, for cloud simulators (Limrun) -- demo-video
# recording and hands-on checks without a Mac. ci.yml's ios-app-build job
# compiles the same thing but discards the output.
#
# Release configuration so the app behaves like the shipped one (no DEBUG
# hooks). Built with code signing off, then ad-hoc signed: Apple silicon
# requires at least an ad-hoc signature even for simulator binaries. The
# Info.plist keeps its RevenueCat Test Store key (never the production
# one) -- right for a simulator, and the Pro gate that matters is enforced
# server-side against the signed-in account anyway.
on:
  workflow_dispatch:
  push:
    branches:
      - "chore/simulator-app-artifact"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LearnWithAlphonso
        run: xcodegen generate

      - name: Build for iOS Simulator (Release)
        working-directory: ios/LearnWithAlphonso
        run: |
          xcodebuild build \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad-hoc sign and zip
        working-directory: ios/LearnWithAlphonso
        run: |
          APP=build/dd/Build/Products/Release-iphonesimulator/LearnWithAlphonso.app
          test -d "$APP" || { echo "::error::No .app at $APP"; exit 1; }
          codesign --force --deep --sign - "$APP"
          # The hand-written entitlements file has XML comments; Xcode strips
          # them, raw codesign ("AMFIUnserializeXML: syntax error") can't.
          plutil -convert xml1 -o "$RUNNER_TEMP/app.entitlements" LearnWithAlphonso-Release.entitlements
          codesign --force --sign - --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          codesign --verify --verbose "$APP"
          lipo -info "$APP/LearnWithAlphonso"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          mkdir -p build/out
          ditto -c -k --keepParent "$APP" build/out/LearnWithAlphonso-simulator.zip
          ls -la build/out

      - uses: actions/upload-artifact@v4
        with:
          name: LearnWithAlphonso-simulator
          path: ios/LearnWithAlphonso/build/out/LearnWithAlphonso-simulator.zip
          retention-days: 14
