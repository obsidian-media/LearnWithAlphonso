name: Update App Store Metadata

# Manual only. "check" prints the current versus new listing text and
# writes nothing. "apply" writes the reviewed copy (Description, Keywords,
# Promotional Text, Support/Marketing URL, and the Subtitle) to the app's
# editable App Store Connect version via PATCH -- the same effect as
# typing into the web UI and not pressing "Add for Review". SAVE ONLY:
# never touches appStoreState, never calls the submit-for-review endpoint.
#
# Uses the same APP_STORE_CONNECT_KEY_ID/ISSUER_ID/KEY_P8_BASE64 secrets
# already configured for ios-release.yml -- no new credentials.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (prints current vs new, writes nothing) or apply (save-only PATCH, never submits)"
        required: true
        type: choice
        default: check
        options:
          - check
          - apply

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: app-store-connect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Write App Store Connect metadata (save only, no submission)
        run: bun scripts/update-app-store-metadata.ts "$MODE"
        env:
          MODE: ${{ inputs.mode }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
