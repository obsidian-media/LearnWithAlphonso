name: Upload App Store Review Screenshot

# Manual only -- uploads the account-owner-approved App Store Review
# Screenshot for the "Alphonso Pro" subscription (reference name
# "Alphonso Pro Monthly"), replacing any screenshot already attached. The real image lives at
# .github/scratch/review-screenshot.png on this same branch, added and
# explicitly approved by the account owner before this workflow exists.
on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Subscription id"
        required: true
        type: string
        default: "6815009725"

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: app-store-connect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Upload review screenshot
        run: bun scripts/upload-review-screenshot.ts "$SUBSCRIPTION_ID" .github/scratch/review-screenshot.png
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
