name: Seed Demo Account

# Creates (if missing) and seeds the App Review demo account into
# review-ready state -- lesson progress, a streak, due reviews, a podcast
# resume point -- without running the whole macOS screenshot pipeline,
# which is the only other place this seeding step exists
# (capture-app-store-screenshots.yml).
#
# The account is read from the DEMO_ACCOUNT_EMAIL secret, never an input:
# this repository is public and workflow_dispatch inputs show in run logs
# (same reasoning as grant-demo-entitlement.yml). Pro is granted
# separately by grant-demo-entitlement.yml.
on:
  workflow_dispatch:

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production-supabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Create and seed the demo account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_ACCOUNT_EMAIL: ${{ secrets.DEMO_ACCOUNT_EMAIL }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
        run: bun scripts/seed-demo-account.ts --email "$DEMO_ACCOUNT_EMAIL" --create
