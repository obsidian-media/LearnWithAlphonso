name: Check RevenueCat Offering

# Read-only. Asks RevenueCat for the offerings the APP would see, using
# the same endpoint and the same public SDK key the iOS client uses.
#
# Why it is worth a workflow: an empty paywall has two completely
# different causes that look identical on the device -- Apple has not
# approved the first subscription yet (expected, unavoidable), or
# RevenueCat has no current offering / no packages (our misconfiguration).
# Guessing between them costs a review cycle.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx tsx scripts/check-revenuecat-offering.ts
        env:
          # The PUBLIC SDK key that already ships in Info.plist, not the
          # secret key -- this endpoint takes a public key and a
          # read-only check should not hold more authority than it needs.
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
