name: Capture App Store Screenshots

# Manual only. Seeds the demo account once (scripts/seed-demo-account.ts),
# then boots one 6.9" simulator (Royal light, a clean status bar), mints a
# real session (scripts/mint-demo-session.ts) and runs
# LearnWithAlphonsoUITests/ScreenshotTests, which captures the App Store set
# (Learn map, a lesson question, a story scene, Practice, a call, Hector,
# Library, Profile). Each capture proves it is the right, loaded screen or
# the run fails (see that file's header). Hector needs a Pro demo account;
# nothing here grants Pro.
#
# Uses SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY -- same secrets ci.yml
# already uses, nothing new needed. Seeding is its own job (not repeated
# per simulator) so two parallel runs of the delete-then-reinsert reseed
# in seed-demo-account.ts can't race each other.
on:
  # No email input: this repository is PUBLIC and workflow_dispatch
  # inputs are visible in run logs to anyone. The demo account is read
  # from the DEMO_ACCOUNT_EMAIL secret instead, the same one
  # grant-demo-entitlement.yml uses -- one source of truth, and nothing
  # published.
  workflow_dispatch:

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production-supabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Seed the demo account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_ACCOUNT_EMAIL: ${{ secrets.DEMO_ACCOUNT_EMAIL }}
        run: bun scripts/seed-demo-account.ts --email "$DEMO_ACCOUNT_EMAIL"

  screenshots:
    needs: seed
    runs-on: macos-latest
    environment: production-supabase
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1320x2868 -- the 6.9" slot of the App Store listing.
          - device: "iPhone 17 Pro Max"
            device_type_id: "iPhone-17-Pro-Max"
            label: appstore-69
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Install XcodeGen
        run: bash scripts/install-xcodegen.sh  # pinned version and checksum

      - name: Generate Xcode project
        working-directory: ios/LearnWithAlphonso
        run: xcodegen generate

      - name: Mint a real session for the seeded demo account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_ACCOUNT_EMAIL: ${{ secrets.DEMO_ACCOUNT_EMAIL }}
        # Masked before they reach GITHUB_ENV: values appended there are not
        # secrets to GitHub and would otherwise print in every later step's env
        # dump of this public repo's log (BACKLOG 0.0-aa).
        run: |
          set -o pipefail
          bun scripts/mint-demo-session.ts --email "$DEMO_ACCOUNT_EMAIL" | bash scripts/export-masked-env.sh

      - name: Create and boot ${{ matrix.device }}
        run: |
          # Create a fresh device instance rather than searching for a
          # pre-existing one -- found live: this runner image only
          # pre-creates a specific subset of devices per iOS runtime
          # (iPhone 17 Pro/Pro Max/Air/17/16e on iOS 26.2 here), not the
          # full type x runtime matrix, so "iPhone 16 Pro Max" and
          # "iPhone 16" -- both valid device *types* -- had no instance to
          # find. `simctl create` doesn't depend on the runner's defaults.
          RUNTIME_ID=$(xcrun simctl list runtimes available ios | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1 || true)
          if [ -z "$RUNTIME_ID" ]; then
            echo "No available iOS runtime found:"
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Using runtime $RUNTIME_ID"
          UDID=$(xcrun simctl create "screenshot-${{ matrix.label }}" "com.apple.CoreSimulator.SimDeviceType.${{ matrix.device_type_id }}" "$RUNTIME_ID")
          echo "Created $UDID (${{ matrix.device }})"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Royal light (the theme follows the system appearance) and a clean, store-style status bar.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3

      - name: Build for testing
        working-directory: ios/LearnWithAlphonso
        run: |
          xcodebuild build-for-testing \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination "id=$SIMULATOR_UDID" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run screenshot UI test
        working-directory: ios/LearnWithAlphonso
        env:
          SCREENSHOT_OUTPUT_DIR: ${{ github.workspace }}/screenshots/${{ matrix.label }}
        run: |
          mkdir -p "$SCREENSHOT_OUTPUT_DIR"
          # A TEST_RUNNER_-prefixed xcodebuild argument (tried first) did
          # NOT reach the xctest process -- confirmed live: the app was
          # still on the plain sign-in screen after that change shipped.
          # These plain NAME=value overrides instead resolve project.yml's
          # scheme-level `environmentVariables` ($(UI_TEST_ACCESS_TOKEN)
          # etc.), the actual first-class Xcode Test-action-environment
          # feature, not a CLI convention -- see that scheme block's own
          # comment for why this replaces rather than stacks on the guess.
          xcodebuild test-without-building \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath "${{ github.workspace }}/screenshots/${{ matrix.label }}.xcresult" \
            -only-testing:LearnWithAlphonsoUITests/ScreenshotTests/testCaptureAppStoreScreenshots \
            SCREENSHOT_OUTPUT_DIR="$SCREENSHOT_OUTPUT_DIR" \
            UI_TEST_ACCESS_TOKEN="$UI_TEST_ACCESS_TOKEN" \
            UI_TEST_REFRESH_TOKEN="$UI_TEST_REFRESH_TOKEN" \
            UI_TEST_USER_ID="$UI_TEST_USER_ID" \
            UI_TEST_EXPIRES_AT="$UI_TEST_EXPIRES_AT"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ matrix.label }}
          path: |
            screenshots/${{ matrix.label }}/*.png
            screenshots/${{ matrix.label }}/*.txt
          if-no-files-found: warn

      - name: Upload test result bundle (screenshots are attached here too)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcresult-${{ matrix.label }}
          # Not under ios/LearnWithAlphonso/ at all -- xcodebuild puts a
          # result bundle in DerivedData unless told otherwise, which the
          # earlier `ios/LearnWithAlphonso/**/*.xcresult` glob never
          # matched (confirmed live: it always warned "no files found",
          # silently, even on a passing run). -resultBundlePath above
          # pins it here instead.
          path: screenshots/${{ matrix.label }}.xcresult
          if-no-files-found: warn
