name: Capture App Store Screenshots

# Manual only. Seeds the demo account once (scripts/seed-demo-account.ts),
# then boots two simulators (the App Store 6.7" size and the Devpost-spec
# 6.1" size -- screenshot-shot-list.md) in parallel, each minting its own
# real session (scripts/mint-demo-session.ts) and running
# LearnWithAlphonsoUITests/ScreenshotTests to capture every screen it can
# automate. Does not attempt Hector's shot (a real voice exchange) -- see
# that test file's own header comment for why.
#
# Uses SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY -- same secrets ci.yml
# already uses, nothing new needed. Seeding is its own job (not repeated
# per simulator) so two parallel runs of the delete-then-reinsert reseed
# in seed-demo-account.ts can't race each other.
on:
  workflow_dispatch:
    inputs:
      demo_account_email:
        description: "Seeded demo account email (scripts/seed-demo-account.ts)"
        required: true
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Seed the demo account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/seed-demo-account.ts --email "${{ inputs.demo_account_email }}"

  screenshots:
    needs: seed
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1320x2868 -- the shot list's own table says Apple accepts this
          # OR 1290x2796 for the 6.9"/6.7" slot. Chosen because it's this
          # one that's actually pre-created on GitHub's macOS runner image
          # (confirmed live: "iPhone 16 Pro Max" -- 1290x2796 -- is a valid
          # device *type* but has no pre-created device *instance* here,
          # which `simctl create` below sidesteps anyway, but no reason to
          # fight the runner's defaults for a resolution the shot list
          # already says is optional).
          - device: "iPhone 17 Pro Max"
            device_type_id: "iPhone-17-Pro-Max"
            label: appstore-69
          # Devpost's own spec, exactly: 1179x2556, no device frame.
          - device: "iPhone 16"
            device_type_id: "iPhone-16"
            label: devpost
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LearnWithAlphonso
        run: xcodegen generate

      - name: Mint a real session for the seeded demo account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bun scripts/mint-demo-session.ts --email "${{ inputs.demo_account_email }}" >> "$GITHUB_ENV"

      - name: Create and boot ${{ matrix.device }}
        run: |
          # Create a fresh device instance rather than searching for a
          # pre-existing one -- found live: this runner image only
          # pre-creates a specific subset of devices per iOS runtime
          # (iPhone 17 Pro/Pro Max/Air/17/16e on iOS 26.2 here), not the
          # full type x runtime matrix, so "iPhone 16 Pro Max" and
          # "iPhone 16" -- both valid device *types* -- had no instance to
          # find. `simctl create` doesn't depend on the runner's defaults.
          RUNTIME_ID=$(xcrun simctl list runtimes available ios | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1 || true)
          if [ -z "$RUNTIME_ID" ]; then
            echo "No available iOS runtime found:"
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Using runtime $RUNTIME_ID"
          UDID=$(xcrun simctl create "screenshot-${{ matrix.label }}" "com.apple.CoreSimulator.SimDeviceType.${{ matrix.device_type_id }}" "$RUNTIME_ID")
          echo "Created $UDID (${{ matrix.device }})"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      - name: Build for testing
        working-directory: ios/LearnWithAlphonso
        run: |
          xcodebuild build-for-testing \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination "id=$SIMULATOR_UDID" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run screenshot UI test
        working-directory: ios/LearnWithAlphonso
        env:
          SCREENSHOT_OUTPUT_DIR: ${{ github.workspace }}/screenshots/${{ matrix.label }}
        run: |
          mkdir -p "$SCREENSHOT_OUTPUT_DIR"
          xcodebuild test-without-building \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination "id=$SIMULATOR_UDID" \
            -only-testing:LearnWithAlphonsoUITests/ScreenshotTests/testCaptureAppStoreScreenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.label }}
          path: screenshots/${{ matrix.label }}/*.png
          if-no-files-found: warn

      - name: Upload test result bundle (screenshots are attached here too)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.label }}
          path: ios/LearnWithAlphonso/**/*.xcresult
          if-no-files-found: ignore
