name: Android CI

# The Android app's own pipeline, deliberately separate from ci.yml
# (owner decision 2026-09-29). Nothing here gates a web or iOS deploy.

on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - "scripts/export-android-content.ts"
      - "src/lib/ios-content-export.ts"
      - "src/data/**"
      # The avatar parity fixtures the Kotlin tests replay (core AvatarParityTest).
      - "shared/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/export-android-content.ts"
      - "src/lib/ios-content-export.ts"
      - "src/data/**"
      # The avatar parity fixtures the Kotlin tests replay (core AvatarParityTest).
      - "shared/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  content:
    name: Bundled content is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Regenerate and diff
        run: |
          bun scripts/export-android-content.ts
          git diff --exit-code -- android/LearnWithAlphonso/app/src/main/assets \
            || { echo "::error::Bundled Android content is stale. Run: bun scripts/export-android-content.ts and commit."; exit 1; }

  unit:
    name: JVM tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/LearnWithAlphonso
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: chmod +x gradlew
      - name: Firebase config (only when the owner has set the secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-unit-reports
          path: |
            android/LearnWithAlphonso/core/build/reports/
            android/LearnWithAlphonso/app/build/reports/

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/LearnWithAlphonso
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: chmod +x gradlew
      - name: Firebase config (only when the owner has set the secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apk
          path: android/LearnWithAlphonso/app/build/outputs/apk/debug/app-debug.apk
          # Public repo: anyone signed in to GitHub can download artifacts, and this build may embed the Firebase
          # config. One day is enough to grab it for a manual check.
          retention-days: 1

  emulator:
    name: Instrumentation tests (API 34 emulator)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: chmod +x android/LearnWithAlphonso/gradlew
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android/LearnWithAlphonso
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-instrumentation-reports
          path: android/LearnWithAlphonso/app/build/reports/androidTests/
