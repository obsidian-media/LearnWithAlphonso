name: Android CI

# The Android app's own pipeline, deliberately separate from ci.yml
# (owner decision 2026-09-29). Nothing here gates a web or iOS deploy.

on:
  push:
    # main too, so its runs fill the Gradle cache: setup-gradle only WRITES the cache on the default branch, and every
    # PR run started cold while main never ran this workflow.
    branches: [main, android]
    paths:
      - "android/**"
      - "scripts/export-android-content.ts"
      - "src/lib/ios-content-export.ts"
      - "src/data/**"
      # The avatar parity fixtures the Kotlin tests replay (core AvatarParityTest).
      - "shared/**"
      # The design system source the Kotlin tokens, icons and raw-value guard are checked against.
      - "design/**"
      - ".github/workflows/android-ci.yml"
  # No paths filter here: a filtered workflow never reports on a web-only PR, and a required check that never reports
  # blocks that PR forever. The `changes` job below does the path filtering instead; jobs it skips report "skipped",
  # which GitHub counts as passing for a required check.
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's stale run; branch pushes (main included) are never cancelled and get a group
# of their own, because a shared group still drops all but one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  # Decides whether the PR touches anything the Android pipeline cares about. The list must match the push trigger's
  # paths above. Push and manual runs always count as Android-relevant.
  changes:
    name: Android paths changed
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Compare against the PR base
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$GITHUB_SHA" | grep -Eq '^(android/|scripts/export-android-content\.ts$|src/lib/ios-content-export\.ts$|src/data/|shared/|design/|\.github/workflows/android-ci\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  content:
    name: Bundled content is up to date
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Regenerate and diff
        run: |
          bun scripts/export-android-content.ts
          git diff --exit-code -- android/LearnWithAlphonso/app/src/main/assets \
            || { echo "::error::Bundled Android content is stale. Run: bun scripts/export-android-content.ts and commit."; exit 1; }

  unit:
    name: JVM tests and lint
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/LearnWithAlphonso
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: chmod +x gradlew
      - name: Firebase config (only when the owner has set the secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-unit-reports
          path: |
            android/LearnWithAlphonso/core/build/reports/
            android/LearnWithAlphonso/app/build/reports/

  build:
    name: Debug APK
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/LearnWithAlphonso
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: chmod +x gradlew
      - name: Firebase config (only when the owner has set the secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apk
          path: android/LearnWithAlphonso/app/build/outputs/apk/debug/app-debug.apk
          # Public repo: anyone signed in to GitHub can download artifacts, and this build may embed the Firebase
          # config. One day is enough to grab it for a manual check.
          retention-days: 1

  # The release variant with R8 on, as android-release.yml builds it, minus the real secrets: a placeholder RevenueCat
  # key (it only has to pass the build's non-test_ check; nothing is bought) and the throwaway debug signing key. A
  # keep rule R8 needs shows up here instead of after an upload to Play.
  release-build:
    name: Minified release build
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/LearnWithAlphonso
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: chmod +x gradlew
      - name: Build the release APK with R8
        env:
          REVENUECAT_ANDROID_PUBLIC_KEY: goog_ci_placeholder_not_a_real_key
          ANDROID_RELEASE_CHECK_DEBUG_SIGNING: "true"
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release-check-apk
          path: |
            android/LearnWithAlphonso/app/build/outputs/apk/release/app-release.apk
            android/LearnWithAlphonso/app/build/outputs/mapping/release/mapping.txt
          # Debug-signed and carrying a placeholder key: only for the launch check below and a manual look.
          retention-days: 1

  release-launch:
    name: Minified release launches (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, release-build]
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-release-check-apk
          path: android/LearnWithAlphonso/release-check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android/LearnWithAlphonso
          script: bash scripts/release-launch-check.sh release-check/apk/release/app-release.apk

  emulator:
    name: Instrumentation tests (API 34 emulator)
    runs-on: ubuntu-latest
    needs: [changes, unit]
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: chmod +x android/LearnWithAlphonso/gradlew
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android/LearnWithAlphonso
          script: ./gradlew connectedDebugAndroidTest
      # The Gradle log only says "There were failing tests"; name them in the job summary so the reason is obvious.
      - name: Summarise failing instrumentation tests
        if: failure()
        run: |
          {
            echo "### Instrumentation tests that failed"
            grep -rl "<failure" android/LearnWithAlphonso/app/build/outputs/androidTest-results --include=*.xml 2>/dev/null | while read -r f; do
              grep -B1 "<failure" "$f" | grep -o 'testcase name="[^"]*" classname="[^"]*"' || true
              grep -h -A2 "<failure" "$f" | head -6
            done
            echo "(full HTML report: the android-instrumentation-reports artifact)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-instrumentation-reports
          path: android/LearnWithAlphonso/app/build/reports/androidTests/
