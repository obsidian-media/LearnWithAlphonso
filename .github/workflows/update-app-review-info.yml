name: Update App Review Info

# Manual only. "check" validates the notes and prints their length and the
# live product title, writing nothing. "apply" writes Copyright (appStoreVersions) and the App Review
# Information block (contact, demo account, notes -- appReviewDetail) to
# the app's current draft App Store Connect version via PATCH/POST -- the
# same effect as typing into the web UI and not pressing "Add for
# Review". SAVE ONLY: never touches appVersionState, never calls the
# submit-for-review endpoint.
#
# Uses the same APP_STORE_CONNECT_KEY_ID/ISSUER_ID/KEY_P8_BASE64 secrets
# already configured for ios-release.yml -- no new credentials.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (validates the notes, writes nothing) or apply (save-only, never submits)"
        required: true
        type: choice
        default: check
        options:
          - check
          - apply

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: app-store-connect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Write App Review Information (save only, no submission)
        run: bun scripts/update-app-review-info.ts "$MODE"
        env:
          MODE: ${{ inputs.mode }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          DEMO_ACCOUNT_EMAIL: ${{ secrets.DEMO_ACCOUNT_EMAIL }}
          REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
          REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
          REVIEW_DEMO_CODE_URL: ${{ secrets.REVIEW_DEMO_CODE_URL }}
          REVIEW_RECORDING_URL: ${{ secrets.REVIEW_RECORDING_URL }}
