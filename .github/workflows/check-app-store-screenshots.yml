name: Check App Store Screenshots

# Manual only, read-only. Reports the App Store listing screenshots
# currently attached to the app's editable version, per localization and
# device class. Distinct from the subscription's own review screenshot.
#
# Uses the same APP_STORE_CONNECT_KEY_ID/ISSUER_ID/KEY_P8_BASE64 secrets
# already configured for ios-release.yml -- no new credentials.
on:
  workflow_dispatch:

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: app-store-connect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Check App Store listing screenshots (read-only)
        run: bun scripts/check-app-store-screenshots.ts
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
