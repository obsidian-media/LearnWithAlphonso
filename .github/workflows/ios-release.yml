name: iOS Release Archive

# Manual only -- unlike ios-app-build (which runs on every PR/push against
# the simulator with CODE_SIGNING_ALLOWED=NO), this job produces a real
# signed archive, so it must not run automatically on every push. Trigger
# from the Actions tab (or `gh workflow run ios-release.yml`) when you
# actually want a signed build.
#
# Signing: MANUAL, using a persisted certificate -- not
# -allowProvisioningUpdates (automatic signing). Found + fixed 2026-09-21:
# automatic signing on a GitHub-hosted runner (a fresh VM every run,
# nothing persists) has no way to reuse a previous run's certificate --
# its private key only ever existed in that run's now-destroyed keychain
# -- so every release run was minting a brand-new certificate instead of
# reusing one, until the account's certificate cap was hit (see
# docs/BACKLOG.md's "certificate-limit blocker" entry for the full
# writeup, and scripts/generate-ios-distribution-signing.ts for how the
# persisted certificate below was generated). This workflow now imports
# one certificate + provisioning profile into a temporary keychain every
# run instead -- the standard CI signing pattern, and immune to ever
# hitting that cap again from this workflow.
#
# The actual CODE_SIGN_STYLE=Manual/PROVISIONING_PROFILE_SPECIFIER
# settings live in project.yml (XcodeGen), scoped to just the app target
# -- NOT passed here as global xcodebuild command-line overrides. Found
# live 2026-09-21: a global override also lands on Xcode's implicit
# signing targets for SPM package products (RevenueCat,
# LearnWithAlphonsoKit), which categorically reject provisioning
# profiles and fail the archive. This step just passes PROFILE_UUID
# through as a build-setting override so project.yml's
# PROVISIONING_PROFILE_SPECIFIER: "$(PROFILE_UUID)" can resolve it.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID                    -- your Apple Developer Team ID
#   APP_STORE_CONNECT_KEY_ID         -- API key ID (App Store Connect -> Users and Access -> Keys)
#   APP_STORE_CONNECT_ISSUER_ID      -- API key's Issuer ID
#   APP_STORE_CONNECT_KEY_P8_BASE64  -- the key's .p8 file, base64-encoded
#                                        (only used for the TestFlight upload step now,
#                                        signing no longer needs it)
#   IOS_DIST_CERTIFICATE_P12_BASE64  -- the persisted Distribution cert+key, base64-encoded .p12
#   IOS_DIST_CERTIFICATE_PASSWORD    -- password protecting that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  -- the matching App Store provisioning profile, base64-encoded
#   IOS_PROVISIONING_PROFILE_UUID    -- that profile's UUID (from profile-info.txt when it was generated)
#   IOS_WIDGET_PROVISIONING_PROFILE_BASE64 -- same, for the LearnWithAlphonsoWidget
#   IOS_WIDGET_PROVISIONING_PROFILE_UUID   -- extension target's own App ID
#                                        (com.obsidianmedia.learnwithalphonso.widget) --
#                                        added 2026-09-22 once that App ID existed and
#                                        had the App Groups capability linked to
#                                        group.com.obsidianmedia.learnwithalphonso.
#   REVENUECAT_API_KEY               -- RevenueCat dashboard's production
#                                        (non-test_-prefixed) public SDK key.
#                                        Left unset/empty, the archive still
#                                        builds and launches fine -- Pro
#                                        purchases are just unavailable that
#                                        build (see AppConfig.swift/
#                                        EntitlementStore.swift) -- but never
#                                        leave this pointed at a test_ key,
#                                        which crashes on launch in a
#                                        TestFlight/App Store build (see
#                                        project.yml's Release config comment).
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the signed .ipa to App Store Connect (TestFlight) after exporting it"
        type: boolean
        default: false

jobs:
  archive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode meets Apple's current minimum
        run: |
          # Found in a 2026-09-28 audit: runs-on: macos-latest was never
          # checked against what it actually resolved to. Apple has
          # required Xcode 26+ for every new App Store submission since
          # 2026-04-28 -- not a future concern, already in effect. This
          # doesn't pin an exact version (macos-latest's bundled Xcode
          # versions change as GitHub updates the image, and hardcoding
          # one would go stale), it asserts the floor Apple actually
          # enforces.
          VERSION=$(xcodebuild -version | head -1 | grep -oE '[0-9]+' | head -1)
          echo "Detected Xcode major version: $VERSION"
          if [ "$VERSION" -lt 26 ]; then
            echo "::error::macos-latest resolved to Xcode $VERSION, but Apple has required Xcode 26+ for App Store submissions since 2026-04-28. This archive would be rejected at upload."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LearnWithAlphonso
        env:
          PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
          WIDGET_PROFILE_UUID: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_UUID }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          sed -i '' "s/PLACEHOLDER_PROVISIONING_PROFILE_UUID/$PROFILE_UUID/" project.yml
          sed -i '' "s/PLACEHOLDER_WIDGET_PROVISIONING_PROFILE_UUID/$WIDGET_PROFILE_UUID/" project.yml
          xcodegen generate
          # RCApiKey lives directly in Info.plist now, not as an
          # INFOPLIST_KEY_* build setting -- found live 2026-09-23 that
          # Xcode's Info.plist-synthesis-merged-with-a-real-INFOPLIST_FILE
          # mode (this target uses both) only merges Apple's own
          # well-known keys that way, not arbitrary custom ones, even
          # though the build setting itself resolved correctly at every
          # other layer (generated .pbxproj, xcodebuild -showBuildSettings).
          # See Info.plist's own comment on its RCApiKey entry for the
          # full writeup. Substituting after `xcodegen generate` (which
          # doesn't touch Info.plist) rather than before, purely to keep
          # this step grouped with the project-generation step logically.
          sed -i '' "s/test_UzoFLqAlXAHPWSwBgKQuZcqFKrq/$REVENUECAT_API_KEY/" Info.plist

      - name: Verify RCApiKey is a real production key
        working-directory: ios/LearnWithAlphonso
        run: |
          # Found in a 2026-09-28 audit, tightened in a second-opinion
          # audit the same day: this used to also allow an EMPTY key
          # through ("Pro purchases just stay unavailable that build").
          # That was true and harmless as a general statement, but this
          # workflow produces the actual release candidate -- an empty
          # REVENUECAT_API_KEY secret here means Pro would stay
          # unavailable in a shipped build with no loud signal anywhere,
          # indistinguishable from Apple's own real first-subscription
          # pre-approval "unavailable" state (see EntitlementStore.swift)
          # until someone happens to notice after approval. A test_
          # key is still refused separately, since that one crashes on
          # launch rather than merely disabling Pro.
          KEY=$(/usr/libexec/PlistBuddy -c "Print :RCApiKey" Info.plist)
          if [[ "$KEY" == test_* ]]; then
            echo "::error::RCApiKey resolved to a test_ key ('$KEY') -- REVENUECAT_API_KEY is misconfigured. This would crash on launch in a real build. Refusing to archive."
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::RCApiKey is empty -- REVENUECAT_API_KEY secret is not set. This release candidate would ship with Pro purchases permanently disabled. Refusing to archive."
            exit 1
          fi
          echo "RCApiKey OK (non-empty, non-test_ key)."

      - name: Write App Store Connect API key
        working-directory: ios/LearnWithAlphonso
        env:
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p private_keys
          echo "$KEY_P8_BASE64" | base64 --decode > "private_keys/AuthKey_${KEY_ID}.p8"

      # Manual signing setup: import the one persisted Distribution
      # certificate into a temporary keychain and install its matching
      # provisioning profile, rather than -allowProvisioningUpdates minting
      # a fresh certificate every run (see this file's header comment).
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/ci.mobileprovision
          echo "$WIDGET_PROFILE_BASE64" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/ci-widget.mobileprovision

      - name: Write ExportOptions.plist
        working-directory: ios/LearnWithAlphonso
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.obsidianmedia.learnwithalphonso
          PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
          WIDGET_BUNDLE_ID: com.obsidianmedia.learnwithalphonso.widget
          WIDGET_PROFILE_UUID: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_UUID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
              <key>${WIDGET_BUNDLE_ID}</key>
              <string>${WIDGET_PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive (manual signing with persisted certificate)
        working-directory: ios/LearnWithAlphonso
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination 'generic/platform=iOS' \
            -archivePath build/LearnWithAlphonso.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export signed .ipa
        working-directory: ios/LearnWithAlphonso
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LearnWithAlphonso.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Validate the exported .ipa itself, not just the source
        working-directory: ios/LearnWithAlphonso
        run: |
          # Found in a 2026-09-28 audit: this workflow archived and
          # exported but never once looked at what actually came out --
          # static source checks (this file's own RCApiKey step above,
          # PrivacyInfo.xcprivacy's existence, the entitlements files)
          # prove intent, not the signed binary. This unzips the real
          # .ipa and checks the artifact that would actually be uploaded.
          IPA=$(ls build/export/*.ipa | head -1)
          rm -rf build/ipa-check
          mkdir -p build/ipa-check
          unzip -q "$IPA" -d build/ipa-check
          APP=$(find build/ipa-check/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "Inspecting $APP"

          echo "-- Widget extension embedded? --"
          WIDGET=$(find "$APP/PlugIns" -maxdepth 1 -name "*.appex" 2>/dev/null | head -1)
          if [ -z "$WIDGET" ]; then
            echo "::error::No .appex found in $APP/PlugIns -- the widget is not embedded in the shipped binary."
            exit 1
          fi
          echo "Found: $WIDGET"

          echo "-- Privacy manifest present in the shipped bundle? --"
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "::error::PrivacyInfo.xcprivacy is not in the exported app bundle."
            exit 1
          fi

          echo "-- iPhone-only: UIDeviceFamily must be exactly [1] --"
          # Found at the Add-for-Review step, 2026-09-29: builds up to 48
          # shipped UIDeviceFamily [1, 2] (iPhone AND iPad) because
          # XcodeGen's per-target platform preset overrode the
          # project-level TARGETED_DEVICE_FAMILY "1". App Store Connect then
          # demanded 13-inch iPad screenshots and App Review would test on
          # iPad. Fail the release rather than ship that again.
          FAMILY=$(plutil -extract UIDeviceFamily json -o - "$APP/Info.plist")
          if [ "$FAMILY" != "[1]" ]; then
            echo "::error::Shipped UIDeviceFamily is $FAMILY, expected [1] (iPhone only). Set TARGETED_DEVICE_FAMILY on the target in project.yml."
            exit 1
          fi
          echo "UIDeviceFamily: $FAMILY"

          echo "-- Final RCApiKey is a real, non-empty, non-test_ key, in the actual shipped Info.plist --"
          FINAL_KEY=$(/usr/libexec/PlistBuddy -c "Print :RCApiKey" "$APP/Info.plist")
          if [[ "$FINAL_KEY" == test_* ]]; then
            echo "::error::The shipped .ipa's Info.plist still has a test_ RCApiKey ('$FINAL_KEY')."
            exit 1
          fi
          if [ -z "$FINAL_KEY" ]; then
            echo "::error::The shipped .ipa's Info.plist has an empty RCApiKey -- Pro purchases would be permanently disabled."
            exit 1
          fi

          # `--entitlements - --xml` (dash for stdout, explicit --xml),
          # not `--entitlements :-` -- found the hard way (two failed CI
          # runs) that `:`-prefixed paths are a DEPRECATED codesign
          # syntax, and without --xml the modern default is DER, not
          # text. A stray deprecation notice mixed into the captured
          # variable is the likely reason PlistBuddy couldn't parse
          # $ENTITLEMENTS as a real plist even though plain grep still
          # found key names in it as raw text.
          echo "-- Signed app entitlements include App Groups and Sign in with Apple --"
          ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null)
          echo "$ENTITLEMENTS" | grep -q "com.apple.security.application-groups" \
            || { echo "::error::Signed app is missing the application-groups entitlement."; exit 1; }
          echo "$ENTITLEMENTS" | grep -q "com.apple.developer.applesignin" \
            || { echo "::error::Signed app is missing the applesignin entitlement."; exit 1; }

          # Second-opinion audit (2026-09-28): the checks above only ever
          # looked at the MAIN app's entitlements. The widget has its own
          # separate signature and its own separate provisioning profile
          # (IOS_WIDGET_PROVISIONING_PROFILE_*) -- static project.yml
          # config being correct doesn't prove the actual signed .appex
          # got the entitlement too.
          echo "-- Widget's own signed entitlements include App Groups --"
          WIDGET_ENTITLEMENTS=$(codesign -d --entitlements - --xml "$WIDGET" 2>/dev/null)
          echo "$WIDGET_ENTITLEMENTS" | grep -q "com.apple.security.application-groups" \
            || { echo "::error::Signed widget extension is missing the application-groups entitlement -- it would not be able to read the shared UserDefaults."; exit 1; }

          # Debug's aps-environment is "development"; only Release's is
          # "production" (see both .entitlements files' own comments).
          # This confirms the RIGHT one actually made it into the signed
          # binary, not just that the source file says the right thing.
          #
          # This check went through 3 real attempts before working, kept
          # here so nobody repeats them: (1) grep -A1 "aps-environment" |
          # grep -q production -- fragile against line layout, not the
          # real bug. (2) codesign -d --entitlements :- (piped through a
          # bash variable) + PlistBuddy on a re-echoed file -- PlistBuddy
          # reported the key missing even though grep found it as text
          # two lines above, using the exact same codesign call. (3) the
          # real cause: `:`-prefixed entitlements paths are a DEPRECATED
          # codesign syntax, and without an explicit --xml flag the
          # modern default output is DER, not text -- a stray deprecation
          # notice most likely contaminated the captured variable, which
          # broke PlistBuddy's strict parse while a loose grep substring
          # search still happened to find the key names anyway.
          # --xml with a real file path is the correct, current form.
          echo "-- Production APNs environment (not sandbox/development) --"
          codesign -d --entitlements /tmp/app-entitlements.plist --xml "$APP" 2>/dev/null
          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" /tmp/app-entitlements.plist 2>/dev/null || echo "MISSING")
          if [ "$APS_ENV" != "production" ]; then
            echo "::error::Signed app's aps-environment is '$APS_ENV', not 'production'."
            echo "Raw entitlements file for debugging:"
            cat /tmp/app-entitlements.plist || echo "(file not found or unreadable)"
            exit 1
          fi

          echo "All post-archive checks passed."

      - name: Upload to TestFlight (App Store Connect)
        if: ${{ inputs.upload_to_testflight }}
        working-directory: ios/LearnWithAlphonso
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Clean up API key
        if: always()
        working-directory: ios/LearnWithAlphonso
        run: rm -rf private_keys

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithAlphonso-ipa
          path: ios/LearnWithAlphonso/build/export/*.ipa
          retention-days: 14
