name: iOS Release Archive

# Manual only -- unlike ios-app-build (which runs on every PR/push against
# the simulator with CODE_SIGNING_ALLOWED=NO), this job produces a real
# signed archive using an App Store Connect API key, so it must not run
# automatically on every push. Trigger from the Actions tab (or
# `gh workflow run ios-release.yml`) when you actually want a signed build.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID                    -- your Apple Developer Team ID
#   APP_STORE_CONNECT_KEY_ID         -- API key ID (App Store Connect -> Users and Access -> Keys)
#   APP_STORE_CONNECT_ISSUER_ID      -- API key's Issuer ID
#   APP_STORE_CONNECT_KEY_P8_BASE64  -- the key's .p8 file, base64-encoded
#                                        (e.g. `base64 -i AuthKey_XXXX.p8 | pbcopy` on macOS,
#                                        `base64 -w0 AuthKey_XXXX.p8` on Linux)
#   REVENUECAT_API_KEY               -- RevenueCat dashboard's production
#                                        (non-test_-prefixed) public SDK key.
#                                        Left unset/empty, the archive still
#                                        builds and launches fine -- Pro
#                                        purchases are just unavailable that
#                                        build (see AppConfig.swift/
#                                        EntitlementStore.swift) -- but never
#                                        leave this pointed at a test_ key,
#                                        which crashes on launch in a
#                                        TestFlight/App Store build (see
#                                        project.yml's Release config comment).
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the signed .ipa to App Store Connect (TestFlight) after exporting it"
        type: boolean
        default: false

jobs:
  archive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LearnWithAlphonso
        run: xcodegen generate

      - name: Write App Store Connect API key
        working-directory: ios/LearnWithAlphonso
        env:
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p private_keys
          echo "$KEY_P8_BASE64" | base64 --decode > "private_keys/AuthKey_${KEY_ID}.p8"

      - name: Write ExportOptions.plist
        working-directory: ios/LearnWithAlphonso
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive (automatic signing via App Store Connect API key)
        working-directory: ios/LearnWithAlphonso
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          xcodebuild archive \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination 'generic/platform=iOS' \
            -archivePath build/LearnWithAlphonso.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$(pwd)/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            REVENUECAT_API_KEY="$REVENUECAT_API_KEY"

      - name: Export signed .ipa
        working-directory: ios/LearnWithAlphonso
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LearnWithAlphonso.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$(pwd)/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight (App Store Connect)
        if: ${{ inputs.upload_to_testflight }}
        working-directory: ios/LearnWithAlphonso
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Clean up API key
        if: always()
        working-directory: ios/LearnWithAlphonso
        run: rm -rf private_keys

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithAlphonso-ipa
          path: ios/LearnWithAlphonso/build/export/*.ipa
          retention-days: 14
