name: iOS Release Archive

# Manual only -- unlike ios-app-build (which runs on every PR/push against
# the simulator with CODE_SIGNING_ALLOWED=NO), this job produces a real
# signed archive, so it must not run automatically on every push. Trigger
# from the Actions tab (or `gh workflow run ios-release.yml`) when you
# actually want a signed build.
#
# Signing: MANUAL, using a persisted certificate -- not
# -allowProvisioningUpdates (automatic signing). Found + fixed 2026-09-21:
# automatic signing on a GitHub-hosted runner (a fresh VM every run,
# nothing persists) has no way to reuse a previous run's certificate --
# its private key only ever existed in that run's now-destroyed keychain
# -- so every release run was minting a brand-new certificate instead of
# reusing one, until the account's certificate cap was hit (see
# docs/BACKLOG.md's "certificate-limit blocker" entry for the full
# writeup, and scripts/generate-ios-distribution-signing.ts for how the
# persisted certificate below was generated). This workflow now imports
# one certificate + provisioning profile into a temporary keychain every
# run instead -- the standard CI signing pattern, and immune to ever
# hitting that cap again from this workflow.
#
# The actual CODE_SIGN_STYLE=Manual/PROVISIONING_PROFILE_SPECIFIER
# settings live in project.yml (XcodeGen), scoped to just the app target
# -- NOT passed here as global xcodebuild command-line overrides. Found
# live 2026-09-21: a global override also lands on Xcode's implicit
# signing targets for SPM package products (RevenueCat,
# LearnWithAlphonsoKit), which categorically reject provisioning
# profiles and fail the archive. This step just passes PROFILE_UUID
# through as a build-setting override so project.yml's
# PROVISIONING_PROFILE_SPECIFIER: "$(PROFILE_UUID)" can resolve it.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID                    -- your Apple Developer Team ID
#   APP_STORE_CONNECT_KEY_ID         -- API key ID (App Store Connect -> Users and Access -> Keys)
#   APP_STORE_CONNECT_ISSUER_ID      -- API key's Issuer ID
#   APP_STORE_CONNECT_KEY_P8_BASE64  -- the key's .p8 file, base64-encoded
#                                        (only used for the TestFlight upload step now,
#                                        signing no longer needs it)
#   IOS_DIST_CERTIFICATE_P12_BASE64  -- the persisted Distribution cert+key, base64-encoded .p12
#   IOS_DIST_CERTIFICATE_PASSWORD    -- password protecting that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  -- the matching App Store provisioning profile, base64-encoded
#   IOS_PROVISIONING_PROFILE_UUID    -- that profile's UUID (from profile-info.txt when it was generated)
#   IOS_WIDGET_PROVISIONING_PROFILE_BASE64 -- same, for the LearnWithAlphonsoWidget
#   IOS_WIDGET_PROVISIONING_PROFILE_UUID   -- extension target's own App ID
#                                        (com.obsidianmedia.learnwithalphonso.widget) --
#                                        added 2026-09-22 once that App ID existed and
#                                        had the App Groups capability linked to
#                                        group.com.obsidianmedia.learnwithalphonso.
#   REVENUECAT_API_KEY               -- RevenueCat dashboard's production
#                                        (non-test_-prefixed) public SDK key.
#                                        Left unset/empty, the archive still
#                                        builds and launches fine -- Pro
#                                        purchases are just unavailable that
#                                        build (see AppConfig.swift/
#                                        EntitlementStore.swift) -- but never
#                                        leave this pointed at a test_ key,
#                                        which crashes on launch in a
#                                        TestFlight/App Store build (see
#                                        project.yml's Release config comment).
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the signed .ipa to App Store Connect (TestFlight) after exporting it"
        type: boolean
        default: false

jobs:
  archive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LearnWithAlphonso
        env:
          PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
          WIDGET_PROFILE_UUID: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_UUID }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          sed -i '' "s/PLACEHOLDER_PROVISIONING_PROFILE_UUID/$PROFILE_UUID/" project.yml
          sed -i '' "s/PLACEHOLDER_WIDGET_PROVISIONING_PROFILE_UUID/$WIDGET_PROFILE_UUID/" project.yml
          xcodegen generate
          # RCApiKey lives directly in Info.plist now, not as an
          # INFOPLIST_KEY_* build setting -- found live 2026-09-23 that
          # Xcode's Info.plist-synthesis-merged-with-a-real-INFOPLIST_FILE
          # mode (this target uses both) only merges Apple's own
          # well-known keys that way, not arbitrary custom ones, even
          # though the build setting itself resolved correctly at every
          # other layer (generated .pbxproj, xcodebuild -showBuildSettings).
          # See Info.plist's own comment on its RCApiKey entry for the
          # full writeup. Substituting after `xcodegen generate` (which
          # doesn't touch Info.plist) rather than before, purely to keep
          # this step grouped with the project-generation step logically.
          sed -i '' "s/test_UzoFLqAlXAHPWSwBgKQuZcqFKrq/$REVENUECAT_API_KEY/" Info.plist

      - name: Debug -- verify RCApiKey substitution landed in source Info.plist
        working-directory: ios/LearnWithAlphonso
        run: |
          plutil -p Info.plist | grep -i "RCApiKey" || echo "(no RCApiKey line found in source Info.plist)"

      - name: Write App Store Connect API key
        working-directory: ios/LearnWithAlphonso
        env:
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p private_keys
          echo "$KEY_P8_BASE64" | base64 --decode > "private_keys/AuthKey_${KEY_ID}.p8"

      # Manual signing setup: import the one persisted Distribution
      # certificate into a temporary keychain and install its matching
      # provisioning profile, rather than -allowProvisioningUpdates minting
      # a fresh certificate every run (see this file's header comment).
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/ci.mobileprovision
          echo "$WIDGET_PROFILE_BASE64" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/ci-widget.mobileprovision

      - name: Write ExportOptions.plist
        working-directory: ios/LearnWithAlphonso
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.obsidianmedia.learnwithalphonso
          PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
          WIDGET_BUNDLE_ID: com.obsidianmedia.learnwithalphonso.widget
          WIDGET_PROFILE_UUID: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_UUID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
              <key>${WIDGET_BUNDLE_ID}</key>
              <string>${WIDGET_PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive (manual signing with persisted certificate)
        working-directory: ios/LearnWithAlphonso
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination 'generic/platform=iOS' \
            -archivePath build/LearnWithAlphonso.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Debug -- verify RCApiKey landed in the archived Info.plist
        working-directory: ios/LearnWithAlphonso
        run: |
          PLIST="build/LearnWithAlphonso.xcarchive/Products/Applications/LearnWithAlphonso.app/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "Archived Info.plist not found at expected path -- listing what exists:"
            find build/LearnWithAlphonso.xcarchive -name "Info.plist"
            exit 0
          fi
          echo "=== Full plutil dump, RCApiKey line only (cross-check #1) ==="
          plutil -p "$PLIST" | grep -i "RCApiKey" || echo "(no RCApiKey line found via plutil)"
          echo "=== PlistBuddy Print, using real exit code not string match (cross-check #2) ==="
          if VALUE=$(/usr/libexec/PlistBuddy -c "Print :RCApiKey" "$PLIST" 2>/tmp/plistbuddy_err.txt); then
            echo "RCApiKey PRESENT, length=${#VALUE}"
            echo "starts with 'appl_': $([[ "$VALUE" == appl_* ]] && echo yes || echo no)"
          else
            echo "RCApiKey NOT PRESENT -- PlistBuddy error was:"
            cat /tmp/plistbuddy_err.txt
          fi
          echo "=== All top-level Info.plist keys (sanity check the file itself is real) ==="
          plutil -p "$PLIST" | head -20

      - name: Export signed .ipa
        working-directory: ios/LearnWithAlphonso
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LearnWithAlphonso.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight (App Store Connect)
        if: ${{ inputs.upload_to_testflight }}
        working-directory: ios/LearnWithAlphonso
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Clean up API key
        if: always()
        working-directory: ios/LearnWithAlphonso
        run: rm -rf private_keys

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithAlphonso-ipa
          path: ios/LearnWithAlphonso/build/export/*.ipa
          retention-days: 14
