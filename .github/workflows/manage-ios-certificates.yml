name: Manage iOS Certificates

# Manual only -- a diagnostic/fix tool for the "maximum number of
# certificates" error found 2026-09-21 (see docs/BACKLOG.md and
# scripts/manage-ios-certificates.ts's doc comment for the full
# root-cause writeup). List first to see current state, then revoke
# a specific certificate ID if the account is at its cap.
#
# Uses the same APP_STORE_CONNECT_KEY_ID/ISSUER_ID/KEY_P8_BASE64
# secrets already configured for ios-release.yml -- no new credentials.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "list certificates, list profiles (shows which app each cert is actually used by), or revoke a certificate by ID"
        required: true
        type: choice
        options:
          - list
          - profiles
          - revoke
      certificate_id:
        description: "Certificate ID to revoke (only used when job=revoke, from a prior 'list' run)"
        required: false
        type: string

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    environment: apple-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: List certificates
        if: github.event.inputs.job == 'list'
        run: bun scripts/manage-ios-certificates.ts list
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
      - name: List provisioning profiles (which app each cert is used by)
        if: github.event.inputs.job == 'profiles'
        run: bun scripts/manage-ios-certificates.ts profiles
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
      - name: Revoke certificate
        if: github.event.inputs.job == 'revoke'
        run: bun scripts/manage-ios-certificates.ts revoke "$CERTIFICATE_ID"
        env:
          CERTIFICATE_ID: ${{ github.event.inputs.certificate_id }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
