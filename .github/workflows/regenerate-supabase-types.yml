name: Regenerate Supabase Types

# Runs by itself after the CI workflow's Deploy Supabase job succeeds on main (that job is what applies a
# migration to the live schema, and `types-fresh` stays red until types.ts catches up), and can still be dispatched
# by hand. It never pushes when the types already match, so a deploy with no schema change is a no-op. It is
# re-run whenever a migration lands, so src/integrations/supabase/types.ts never drifts from
# the live schema again. Before this workflow existed, that file went stale
# for 19 tables across several migration batches, forcing `as any` casts
# and an `untyped()` helper into account.functions.ts, apple-link.ts,
# admin.functions.ts and podcast.functions.ts just to compile -- each one a
# place a real type error could pass silently. To run it by hand, use the Actions
# tab (or `gh workflow run regenerate-supabase-types.yml`).
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN -- already configured (deploy-supabase uses it)
#   TYPES_REGEN_DEPLOY_KEY -- private half of the repository deploy key "types-regen workflow (push to main)";
#     loaded only in the final push step, never during install, generate or format
on:
  workflow_dispatch:
  # `workflow_run` always runs the copy of this file on the default branch, so GITHUB_REF_NAME is main below.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# The push is made with the deploy key in the last step, never with the Actions token, so the token stays
# read-only. The gate step reads the CI run's job list, which is public data in this public repository.
permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate types.ts from the live schema and commit
    runs-on: ubuntu-latest
    environment: production-supabase
    # A CI run that failed overall still counts when its deploy job succeeded (types-fresh is red until this runs),
    # so the gate below reads that one job rather than the run's conclusion. This workflow's own push re-runs CI,
    # which would trigger this again: skip the commit it made itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore: regenerate supabase types'))
    steps:
      - name: Only after the deploy job succeeded
        if: github.event_name == 'workflow_run'
        run: |
          # An unreadable answer is not a reason to skip: regenerating when nothing changed is a no-op.
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate --jq '.jobs[] | select(.name == "Deploy Supabase migrations + Edge Functions") | .conclusion' | head -n1 || true)
          echo "Deploy Supabase job conclusion: ${conclusion:-<unknown>}"
          if [ -n "$conclusion" ] && [ "$conclusion" != "success" ]; then
            echo "The deploy job did not succeed on this run, so the live schema did not change; nothing to regenerate."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}

      # Checked out WITHOUT credentials: the install, generate and format steps below run third-party code and must
      # not hold push rights. Only the final step loads the deploy key, for the one push to main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.SKIP != '1'
        with:
          persist-credentials: false

      # Pinned, same reason as ci.yml's deploy-supabase job: `latest`
      # resolves through the GitHub API and can fail on rate limits alone.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        if: env.SKIP != '1'
        with:
          version: 2.118.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.SKIP != '1'
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile
        if: env.SKIP != '1'

      - name: Generate types
        if: env.SKIP != '1'
        run: supabase gen types typescript --project-id qhcjpfbxfcltjbiuknyt > src/integrations/supabase/types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Format to match the repo's Prettier config
        if: env.SKIP != '1'
        run: bunx prettier --write src/integrations/supabase/types.ts

      - name: Commit and push if the schema actually changed
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          if git diff --cached --quiet; then
            echo "Types already match the live schema -- nothing to commit."
            exit 0
          fi
          git commit -m "chore: regenerate supabase types"
          # The deploy key exists for main only (it is the one actor main's ruleset lets push a generated file).
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "This workflow pushes to main only; dispatched from $GITHUB_REF_NAME, so not pushing."
            exit 1
          fi
          key="$RUNNER_TEMP/types-regen-key"
          ( umask 077; printf '%s\n' "$TYPES_REGEN_DEPLOY_KEY" > "$key" )
          trap 'rm -f "$key"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          TYPES_REGEN_DEPLOY_KEY: ${{ secrets.TYPES_REGEN_DEPLOY_KEY }}
