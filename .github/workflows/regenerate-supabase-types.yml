name: Regenerate Supabase Types

# Manual only, same "rare, on-demand" posture as configure-auth-emails.yml --
# not something to re-run on every push, but something to re-run whenever a
# migration lands, so src/integrations/supabase/types.ts never drifts from
# the live schema again. Before this workflow existed, that file went stale
# for 19 tables across several migration batches, forcing `as any` casts
# and an `untyped()` helper into account.functions.ts, apple-link.ts,
# admin.functions.ts and podcast.functions.ts just to compile -- each one a
# place a real type error could pass silently. Trigger from the Actions
# tab (or `gh workflow run regenerate-supabase-types.yml`).
#
# Required repo secret:
#   SUPABASE_ACCESS_TOKEN -- already configured (deploy-supabase uses it)
on:
  workflow_dispatch:

jobs:
  regenerate:
    name: Regenerate types.ts from the live schema and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, same reason as ci.yml's deploy-supabase job: `latest`
      # resolves through the GitHub API and can fail on rate limits alone.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Generate types
        run: supabase gen types typescript --project-id qhcjpfbxfcltjbiuknyt > src/integrations/supabase/types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Format to match the repo's Prettier config
        run: bunx prettier --write src/integrations/supabase/types.ts

      - name: Commit and push if the schema actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          if git diff --cached --quiet; then
            echo "Types already match the live schema -- nothing to commit."
            exit 0
          fi
          git commit -m "chore: regenerate supabase types"
          git push origin HEAD:"$GITHUB_REF_NAME"
