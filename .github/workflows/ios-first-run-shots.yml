name: iOS first-run screenshots

# The first run (visual round 6, part 3) on a real iOS simulator: LearnWithAlphonsoUITests/FirstRunShotsTests walks
# every step before sign-in as a new learner, shows the screens that need an account through the DEBUG harness
# (a made-up learner, no session), and answers Under 13 to check the stop screen survives a relaunch. The
# screenshots are named like the web's, for a side by side. No account and no secrets: nothing here signs in.
#
# Dispatch it by hand, or push the commit to test to the chore/first-run-shots branch.
on:
  workflow_dispatch:
  push:
    branches:
      - "chore/first-run-shots"

concurrency:
  group: ios-first-run-shots
  cancel-in-progress: true

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install XcodeGen
        run: bash scripts/install-xcodegen.sh # pinned version and checksum

      - name: Generate Xcode project
        working-directory: ios/LearnWithAlphonso
        run: xcodegen generate

      - name: Pick, erase and boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          prefer = ["iPhone 16", "iPhone 17", "iPhone"]
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          for p in prefer:
              hits = [d for d in devices if d["name"].startswith(p) and "Plus" not in d["name"] and "Max" not in d["name"]]
              if hits:
                  print(hits[-1]["udid"])
                  break
          ')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          # Erased: a new learner, an empty keychain (the under-13 test leaves its block behind on purpose).
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for testing
        working-directory: ios/LearnWithAlphonso
        run: |
          xcodebuild build-for-testing \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination "id=$SIMULATOR_UDID" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run FirstRunShotsTests
        working-directory: ios/LearnWithAlphonso
        env:
          SCREENSHOT_OUTPUT_DIR: ${{ github.workspace }}/first-run-shots
        run: |
          mkdir -p "$SCREENSHOT_OUTPUT_DIR"
          xcodebuild test-without-building \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath "${{ github.workspace }}/first-run-shots.xcresult" \
            -only-testing:LearnWithAlphonsoUITests/FirstRunShotsTests \
            SCREENSHOT_OUTPUT_DIR="$SCREENSHOT_OUTPUT_DIR"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-run-shots-ios
          path: first-run-shots/*.png
          if-no-files-found: warn

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-run-shots-ios-xcresult
          path: first-run-shots.xcresult
          if-no-files-found: warn
