name: Vocab image links

# App Store review fix: every vocab image URL must resolve. Runs on PRs
# that touch the data or the checker, and weekly so a bucket or CDN problem is
# caught even when nobody edits the file. Deliberately standalone: no job
# `needs` this, so a red result never blocks deploy-supabase or a web deploy.
on:
  pull_request:
    paths:
      - "src/data/vocab-images.ts"
      - "src/lib/vocab-images/link-check.ts"
      - "scripts/check-vocab-image-links.ts"
      - ".github/workflows/vocab-image-links.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Every vocab image URL returns an image
        run: bun scripts/check-vocab-image-links.ts
