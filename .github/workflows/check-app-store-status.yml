name: Check App Store Subscription Status

# Manual only -- Shipaton Day 1 diagnostic. Checks whether the Paid
# Applications Agreement is signed by attempting the real App Store
# Connect API calls that need it (docs/BACKLOG.md's §1.1, and
# D:\AgentDevWork\repos\Hackaton\Shipaton\02-launch-checklist\ for the
# hackathon-timeline version of this checklist). "check" is read-only.
# "create-group" attempts to actually create the real "Alphonso Pro"
# subscription group -- only run that once you intend to actually do
# this, not just to probe status.
#
# Uses the same APP_STORE_CONNECT_KEY_ID/ISSUER_ID/KEY_P8_BASE64
# secrets already configured for ios-release.yml -- no new credentials.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "check (read-only) or create-group (actually creates the real subscription group) or app-info (read-only, category/age rating) or capabilities (read-only, bundle id capabilities e.g. Sign in with Apple) or subscription-state (read-only, the subscription's own review state) or review-screenshot (read-only, the subscription's review screenshot asset) or builds (read-only, recent TestFlight build processing states) or readiness (read-only, everything a Submit for Review click needs) or attach-latest-build (SAVE ONLY -- PATCHes the draft version's build relationship, does not submit)"
        required: true
        type: choice
        options:
          - check
          - create-group
          - app-info
          - capabilities
          - subscription-state
          - review-screenshot
          - builds
          - readiness
          - attach-latest-build

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: app-store-connect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Check subscription/agreement status
        run: bun scripts/check-subscription-status.ts "$JOB"
        env:
          JOB: ${{ github.event.inputs.job }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
