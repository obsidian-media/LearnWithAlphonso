name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      # scripts/export-ios-content.ts is a MANUAL step -- the native app
      # bundles its content as JSON rather than fetching it, so any change to
      # curriculum*.ts / scenarios.ts / campaigns / achievements.ts /
      # vocab-images.ts has to be re-exported by hand. Nothing used to catch a
      # forgotten re-export, and it already bit once: iOS's bundled achievement
      # count silently stayed stale. Regenerating and diffing is the cheapest
      # loud failure -- the fix when this fails is to run the command locally
      # and commit the result, never to edit the JSON by hand.
      - name: Bundled iOS content is up to date
        run: |
          bun scripts/export-ios-content.ts
          if ! git diff --quiet -- ios/; then
            echo "::error::Bundled iOS content is stale. Run 'bun scripts/export-ios-content.ts' and commit the result."
            git diff --stat -- ios/
            git diff -- ios/ | head -100
            exit 1
          fi

      # src/integrations/supabase/types.ts is generated from the LIVE schema,
      # not derived from anything in this repo, so nothing here could catch
      # drift the way the iOS content check above catches its own kind --
      # until now. This went stale by 19 tables across several migration
      # batches before anyone noticed (see PR #153); regenerating and diffing
      # on every PR is the same cheap-loud-failure shape as that check. The
      # fix when this fails is `gh workflow run regenerate-supabase-types.yml`,
      # never a hand edit.
      #
      # KNOWN FALSE-POSITIVE MODE (not fixed by this comment, only named):
      # this regenerates against PRODUCTION, not against what this PR's own
      # pending migrations would produce -- migrations only apply post-merge,
      # in deploy-supabase below. A PR that adds a migration AND updates
      # types.ts in the same PR to use the new table (the normal way to avoid
      # an `as any` cast, per PR #153/#158) will ALWAYS fail here, correctly
      # regenerating the pre-migration shape and diffing it against the
      # forward-looking committed one -- and re-running the suggested fix
      # would not help, since it hits the same unmigrated production schema.
      # The real fix needs generating against a database with THIS PR's
      # migrations applied (a local/ephemeral Postgres in CI, which does not
      # exist here yet -- see podcast-schema.test.ts's comment on the same
      # gap), not a one-line change. Until then: land the migration alone,
      # merge, let deploy-supabase apply it, then regenerate types.ts in a
      # follow-up PR/commit.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Generated Supabase types are up to date
        run: |
          supabase gen types typescript --project-id qhcjpfbxfcltjbiuknyt > src/integrations/supabase/types.ts
          bunx prettier --write src/integrations/supabase/types.ts
          if ! git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "::error::src/integrations/supabase/types.ts is stale. Run the 'Regenerate Supabase Types' workflow (gh workflow run regenerate-supabase-types.yml) and let it commit the result -- never hand-edit this file. If this PR ALSO adds a new migration, this failure is expected until that migration is merged and deployed -- see this step's header comment; re-running this exact fix will not help yet."
            git diff --stat -- src/integrations/supabase/types.ts
            git diff -- src/integrations/supabase/types.ts | head -100
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  admin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The admin app is a second Vite/Nitro build from the same repo
      # (vite.admin.config.ts). Nothing else in CI compiles it, so without
      # this job a broken admin route is invisible until deploy.
      #
      # What this catches: a broken or missing admin route, and a MISSING
      # admin/routeTree.gen.ts. What it does NOT catch: a STALE one --
      # `vite build` regenerates the tree in place and nothing diffs the
      # result, unlike the bundled-iOS-content step above, which does
      # exactly that check. An earlier version of this comment claimed the
      # stale case; it did not hold.
      - name: Build admin app
        run: bun run build:admin

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E + accessibility tests
        # Scoped to unauthenticated routes only -- see playwright.config.ts's
        # top comment. Placeholder Supabase creds are enough for those:
        # getSession() resolves from local storage with no network call
        # when there's no stored session, so no real project is needed.
        run: bun run test:e2e
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_placeholder0000000000000000"
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_placeholder0000000000000000"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deno-tests:
    # Guards the hand-synced Deno ports of src/lib/srs.ts and hearts.ts
    # (supabase/functions/{grade-review,complete-lesson}/*.ts) against
    # silently drifting from the TypeScript source of truth -- see
    # ARCHITECTURE.md's "Known rough edges" for why these are duplicated
    # rather than imported ("nothing enforces that automatically" until
    # this job). *.test.ts files mirror src/lib's own test vectors exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test grade-review's srs.ts port
        run: deno test supabase/functions/grade-review/srs.test.ts

      - name: Test grade-review's spoken-answer.ts port
        run: deno test supabase/functions/grade-review/spoken-answer.test.ts

      - name: Test grade-review's spoken-answer-fr.ts port
        run: deno test supabase/functions/grade-review/spoken-answer-fr.test.ts

      - name: Test grade-review's spoken-answer-es.ts port
        run: deno test supabase/functions/grade-review/spoken-answer-es.test.ts

      - name: Test grade-review's translation-answer.ts port
        run: deno test supabase/functions/grade-review/translation-answer.test.ts

      - name: Test grade-review's answer-correctness rule
        # --allow-env: the translate branch reads NVIDIA_API_KEY to decide
        # whether an AI second opinion is even available.
        run: deno test --allow-env supabase/functions/grade-review/answer-correctness.test.ts

      - name: Test complete-lesson's hearts.ts port
        run: deno test supabase/functions/complete-lesson/hearts.test.ts

      # A new Edge Function directory needs its own deno.json import map, and
      # nothing caught a missing one until the real deploy -- found 2026-09-22
      # shipping get-season-status. `deno check` and `deno test` both pass
      # without it (they resolve npm:/bare specifiers differently), but
      # `supabase functions deploy` fails with:
      #   Relative import path "@supabase/supabase-js" not prefixed with / or ./ or ../
      # That is the deploy-supabase job below, i.e. after merge to main -- so
      # the break lands on main rather than on the PR that caused it.
      # Two migrations sharing a version number is invisible to git -- the
      # filenames differ, so neither PR conflicts -- but Supabase tracks
      # migrations BY VERSION, so `supabase db push` cannot disambiguate and
      # fails. It is not a PR-level failure either: it lands on main, in the
      # deploy job, attributed to whichever PR merged second.
      #
      # Found 2026-09-24 when two parallel sessions independently picked
      # 20260926010000 (the translate question type and the podcast library).
      # Both PRs were green; main's deploy broke on merge.
      - name: Migration versions are unique
        run: |
          versions=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1)
          dupes=$(echo "$versions" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version(s): $dupes"
            echo "Supabase keys applied migrations by version, so two files"
            echo "sharing one version break 'supabase db push' on main."
            echo "Renumber the NOT-YET-APPLIED migration to a later version."
            for v in $dupes; do ls supabase/migrations/ | grep "^${v}_"; done
            exit 1
          fi
          echo "All migration versions are unique."

      - name: Every Edge Function has a deno.json import map
        run: |
          missing=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            # _shared is a plain module directory, not a deployed function --
            # it has no deno.json and does not need one.
            [ "$name" = "_shared" ] && continue
            [ -f "$dir/deno.json" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Edge Function(s) missing a deno.json import map:$missing"
            echo "Copy one from a sibling, e.g. supabase/functions/complete-lesson/deno.json"
            exit 1
          fi
          echo "All Edge Functions have a deno.json."

  deploy-supabase:
    # Applies pending supabase/migrations/*.sql and redeploys the three
    # Edge Functions to the linked project (qhcjpfbxfcltjbiuknyt) whenever
    # a change lands on main. Before this job existed, both steps were a
    # manual "someone has to remember to run this" -- see ARCHITECTURE.md's
    # "Known rough edges" for the incident history that motivated it.
    # Requires repo secrets: SUPABASE_ACCESS_TOKEN (Supabase dashboard ->
    # Account -> Access Tokens), SUPABASE_DB_PASSWORD (Project Settings ->
    # Database -> the project's Postgres password, not the access token),
    # and LESSON_SESSION_SECRET (same value already set as this app's own
    # env var -- complete-lesson/start-lesson-session verify against it).
    # Optionally SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (Project Settings
    # -> Data API / API Keys) to also keep the curriculum-data tables
    # (supabase/migrations/20260918120000_curriculum_data_tables.sql) in
    # sync with curriculum.ts on every push -- see this job's "Seed
    # curriculum data" step. Before that step existed, syncing those tables
    # after a curriculum.ts change was a manual "someone has to remember to
    # run scripts/seed-curriculum-db.ts" step, same class of gap this job
    # itself was created to close for migrations/functions. The step no-ops
    # (doesn't fail the job) if those two secrets aren't set yet.
    name: Deploy Supabase migrations + Edge Functions
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # deno-tests added deliberately: it is the ONLY CI job that ever runs or
    # type-checks anything under supabase/functions/ (tsc's own include is
    # scoped to src/**, and vitest's is scoped to src/**/*.test.ts) -- and
    # this job deploys those exact files with `supabase functions deploy
    # complete-lesson`/`grade-review`. Without this, a red deno-tests result
    # (a broken hand-synced port, a missing deno.json, a duplicate migration
    # version) has zero effect on whether the deploy proceeds: GitHub Actions
    # only blocks a job on what's in its OWN `needs`, and this job's deploy
    # step ships the identical code deno-tests was supposed to have vetted.
    # Found by auditing this file for exactly this shape, not by an incident
    # -- confirmed via real run history that deno-tests happens to finish
    # first today (it's fast), which is why this hasn't caused a visible
    # failure yet; that's luck, not protection.
    needs: [lint-and-typecheck, e2e, deno-tests]
    steps:
      - uses: actions/checkout@v4

      # Pinned, NOT `latest`. `latest` makes setup-cli resolve the release
      # through the GitHub API, which is rate-limited on shared runners --
      # it failed this job twice on 2026-09-26 with "rate limit exceeded",
      # before a single migration ran. A red X here reads exactly like a
      # broken migration, and this job applies migrations, deploys Edge
      # Functions, syncs APNs and seeds the curriculum, so misreading it is
      # expensive. Bump deliberately; that is the trade being made.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Link Supabase project
        run: supabase link --project-ref qhcjpfbxfcltjbiuknyt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Sync Edge Function secrets
        run: supabase secrets set LESSON_SESSION_SECRET="$LESSON_SESSION_SECRET"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LESSON_SESSION_SECRET: ${{ secrets.LESSON_SESSION_SECRET }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy complete-lesson
          supabase functions deploy start-lesson-session
          supabase functions deploy grade-review
          supabase functions deploy send-push
          supabase functions deploy get-season-status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Sync APNs secrets (V4 push notifications)
        # Deliberately conditional on all four being set -- none exist yet
        # (see docs/superpowers/specs/2026-09-21-remote-push-notifications-design.md's
        # hard blocker: the APNs Auth Key is an interactive
        # developer.apple.com action no agent can perform). Once a human
        # creates the key and adds these four as repo secrets, this step
        # starts syncing them with no further workflow change needed --
        # same "no-op until configured, then just works" shape as the rest
        # of this feature. supabase/functions/_shared/apns.ts is the
        # runtime consumer.
        run: |
          if [ -z "$APNS_KEY_P8" ] || [ -z "$APNS_KEY_ID" ] || [ -z "$APNS_TEAM_ID" ] || [ -z "$APNS_BUNDLE_ID" ]; then
            echo "::warning::APNS_KEY_P8/APNS_KEY_ID/APNS_TEAM_ID/APNS_BUNDLE_ID not all set -- skipping APNs secret sync (push send stays a no-op, see this step's header comment)."
            exit 0
          fi
          supabase secrets set APNS_KEY_P8="$APNS_KEY_P8" APNS_KEY_ID="$APNS_KEY_ID" APNS_TEAM_ID="$APNS_TEAM_ID" APNS_BUNDLE_ID="$APNS_BUNDLE_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Seed curriculum data
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY not set -- skipping curriculum data seed (see this job's header comment)."
            exit 0
          fi
          # `bun`, not tsx. tsx is NOT a dependency of this project, so the
          # original node_modules/.bin/tsx path did not exist and would have
          # failed the moment these secrets were set -- a break primed to fire
          # on the day someone finished the setup. `bunx tsx` fixed that by
          # fetching tsx at runtime, but bun runs TypeScript directly and is
          # already what the iOS export step above uses, so there is nothing to
          # fetch and one less way for a step that has NEVER executed to fail
          # on its first real run.
          bun scripts/seed-curriculum-db.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The one test that proves the admin allowlist is unreadable by a
      # client token. It has to run HERE, after `supabase db push`, and
      # nowhere else: `bun run test` runs in lint-and-typecheck, which
      # sets no Supabase env, and the only other job that sets any uses
      # PLACEHOLDER values for Playwright -- so before this step the test
      # skipped in every job, silently, while its own comment claimed CI
      # ran it. ADMIN_RLS_TEST_REQUIRED=1 makes the test FAIL rather than
      # skip if the credentials are absent, so it can never go quiet again.
      #
      # SCOPE, so nobody inherits the belief that was just corrected: this
      # job is `if: push && ref == main`, so this check runs POST-MERGE,
      # not on the pull request. A PR that breaks the allowlist goes green
      # and this fails afterwards, on main. It is a regression alarm, not
      # a merge gate -- treat a red run here as a revert-now signal.
      - name: admin_users is unreadable by a client token
        # The publishable key is resolved from the Supabase Management API
        # with the SUPABASE_ACCESS_TOKEN this job already holds, rather
        # than from a repo secret. The first version read
        # secrets.SUPABASE_PUBLISHABLE_KEY, which does not exist -- only
        # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ACCESS_TOKEN
        # and SUPABASE_DB_PASSWORD do -- so the step failed on its first
        # real run. It failed rather than skipping, which is the whole
        # point of ADMIN_RLS_TEST_REQUIRED, but the check still was not
        # running. Fetching the key needs no new secret and nothing to
        # keep in sync.
        #
        # An empty key is a hard failure, never a skip: a silent skip here
        # is precisely the defect this step exists to prevent.
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref qhcjpfbxfcltjbiuknyt --output json)
          KEY=$(printf '%s' "$KEYS" | jq -r '
            [.[] | select(.name == "publishable" or .name == "anon")][0]
            | (.api_key // .apiKey // .key // empty)
          ')
          if [ -z "$KEY" ]; then
            echo "::error::Could not resolve the publishable key from the Supabase API."
            NAMES=$(printf '%s' "$KEYS" | jq -r '[.[].name] | join(", ")')
            echo "key names returned: $NAMES"
            exit 1
          fi
          SUPABASE_PUBLISHABLE_KEY="$KEY" bunx vitest run src/lib/admin-auth.test.ts
        env:
          ADMIN_RLS_TEST_REQUIRED: "1"
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

  ios-swift-tests:
    # macOS runners ship a working Swift/Xcode toolchain natively, so none
    # of the Windows-specific workarounds in
    # ios/LearnWithAlphonsoKit/swift-test.ps1 (pinned Swift 6.2.4, VS 2022
    # Build Tools, Windows Developer Mode for SwiftPM symlinks) apply here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run LearnWithAlphonsoKit test suite
        run: swift test --package-path ios/LearnWithAlphonsoKit

  ios-app-build:
    # Real build verification for the LearnWithAlphonso app target itself
    # (not just the LearnWithAlphonsoKit package ios-swift-tests covers
    # above) -- this repo has been developed without any local macOS/Xcode
    # access, so this CI job is the *first* real compile of the app target
    # against an actual Xcode toolchain. project.yml is the source of
    # truth (XcodeGen-generated .xcodeproj is never committed -- see
    # ios/LearnWithAlphonso/project.yml's own comment and .gitignore).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LearnWithAlphonso
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios/LearnWithAlphonso
        run: |
          xcodebuild build \
            -project LearnWithAlphonso.xcodeproj \
            -scheme LearnWithAlphonso \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
