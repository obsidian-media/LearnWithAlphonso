name: Update Age Rating Declaration

# Manual only. "check" is read-only (GET the current declaration).
# "apply" PATCHes the specific fields docs/BACKLOG.md sec 0.0y decided
# were under-answered (userGeneratedContent, messagingAndChat, contests)
# -- see scripts/update-age-rating.ts for the exact values and reasoning.
# Age rating is app-level metadata, editable at any time without a new
# app version, same as App Privacy.
#
# Uses the same APP_STORE_CONNECT_KEY_ID/ISSUER_ID/KEY_P8_BASE64 secrets
# already configured for ios-release.yml -- no new credentials.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "check (read-only) or apply (PATCHes the declaration)"
        required: true
        type: choice
        options:
          - check
          - apply

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: app-store-connect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Update age rating declaration
        run: bun scripts/update-age-rating.ts "$JOB"
        env:
          JOB: ${{ github.event.inputs.job }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
