name: Configure Supabase Auth Emails

# Manual only -- these are one-off (or rare) live auth-configuration
# changes, not something to re-apply on every push. Trigger from the
# Actions tab (or `gh workflow run configure-auth-emails.yml`) whenever
# the email templates or SMTP settings actually need to change.
#
# See scripts/update-auth-email-template.ts and
# scripts/configure-custom-smtp.ts for what each job does and why --
# both were written to fix real bugs found 2026-09-21 (iOS's OTP sign-in
# never actually showed the 6-digit code, and Supabase's built-in mailer
# can't email real end users at all until custom SMTP is configured).
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN -- already configured (deploy-supabase uses it)
#   RESEND_API_KEY        -- only for configure-smtp; a Resend API key
#   SMTP_SENDER_EMAIL     -- only for configure-smtp; a sending address on
#                             a domain verified in Resend
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which config change to apply"
        required: true
        type: choice
        options:
          - update-email-template
          - configure-smtp

# Read-only token: nothing here writes to the repository through GitHub.
permissions:
  contents: read

jobs:
  update-email-template:
    if: github.event.inputs.job == 'update-email-template'
    name: Update the magic-link/OTP email template
    runs-on: ubuntu-latest
    environment: production-supabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun scripts/update-auth-email-template.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  configure-smtp:
    if: github.event.inputs.job == 'configure-smtp'
    name: Configure Resend as custom SMTP
    runs-on: ubuntu-latest
    environment: production-supabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun scripts/configure-custom-smtp.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
