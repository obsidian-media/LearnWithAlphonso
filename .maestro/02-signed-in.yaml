# Authenticated user journey. The app's DEBUG-only
# Session.uiTestBootstrapSession reads UI_TEST_ACCESS_TOKEN from the
# process environment; the workflow exports it as SIMCTL_CHILD_* so the
# simulated app sees it and lands signed in on the Learn tab. If bootstrap
# or sync breaks, this flow fails at the first tab assertion -- which is
# exactly the signal we want (it's how the empty-Learn-header bug would
# surface in an automated run instead of in a screenshot nobody checks).
appId: com.obsidianmedia.learnwithalphonso
---
- launchApp:
    clearState: false
    # The demo account is App Review's: skip the one-time covers (Complete your profile, the name prompt) so this
    # read-only walk never answers or dismisses them for it (RootView, DEBUG only).
    arguments:
      UITestSkipOnboarding: true
# The five-tab bar only exists once signed in.
- assertVisible: "Learn"
- assertVisible: "Library"
- assertVisible: "Practice"
- assertVisible: "Hector"
- assertVisible: "Profile"
# Walk the primary surfaces a user (and a reviewer) actually visits.
- tapOn: "Library"
- tapOn: "Practice"
- assertVisible: "Practice speaking"
- tapOn: "Profile"
- tapOn: "Learn"
- assertVisible: "Learn with Alphonso"
